<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who is it?</title>
<style>
  :root{
    --paper:#FCFAF6; --paper-2:#F5F1E8; --ink:#3A3632; --ink-soft:#7C766D;
    --rule:#DCD5C6; --teal:#4E7C7C; --ochre:#B5871F; --sage:#6E8B5A;
    --terracotta:#C56B3E; --mauve:#9676B3;
    --display:'Bradley Hand','Chalkboard SE','Comic Sans MS','Segoe Print','Ink Free',cursive;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',
           'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:30px}
  .wrap{max-width:1480px;margin:0 auto;padding:0 22px 0 70px}

  header{display:flex;align-items:center;justify-content:space-between;gap:18px;
         flex-wrap:wrap;padding:16px 0 10px;border-bottom:2px solid var(--ink)}
  h1{font-family:var(--display);font-size:clamp(25px,3vw,35px);margin:0;line-height:1.05}
  .stars{display:flex;align-items:center;gap:10px;background:var(--paper-2);
         border:2.5px solid var(--ochre);border-radius:14px;padding:6px 18px}
  .stars .who{font-size:15px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
  .stars .n{font-family:var(--display);font-size:36px;line-height:.9;min-width:24px;text-align:center}

  .turn{display:flex;align-items:center;gap:16px;margin:14px 0 12px;
        padding:12px 22px;border:2.5px solid var(--ink);border-radius:15px;
        transition:background .3s ease, border-color .3s ease}
  .turn h2{font-family:var(--display);font-size:clamp(24px,3.2vw,36px);margin:0;line-height:1}
  .turn.find{background:#F3EEF8;border-color:var(--mauve)}
  .turn.find h2{color:#5B4478}
  .turn.answer{background:#FBEEE6;border-color:var(--terracotta)}
  .turn.answer h2{color:#93441C}

  .stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);
         gap:20px;align-items:start}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .card{position:relative;border:2px solid var(--ink);border-radius:12px;
        overflow:hidden;background:#fff;line-height:0;
        transition:opacity .35s ease, filter .35s ease}
  .card img{width:100%;height:auto;display:block}
  .card .nm{position:absolute;left:0;right:0;bottom:0;text-align:center;
        font-family:var(--display);font-size:17px;letter-spacing:.04em;
        background:rgba(252,250,246,.92);border-top:1.5px solid var(--rule);
        padding:2px 0 3px;line-height:1.2}
  .card.out{opacity:.32;filter:grayscale(1)}
  .card.out::after{content:"";position:absolute;inset:8%;
        background:linear-gradient(to bottom right,transparent 46%,var(--terracotta) 46%,
                   var(--terracotta) 54%,transparent 54%),
                   linear-gradient(to bottom left,transparent 46%,var(--terracotta) 46%,
                   var(--terracotta) 54%,transparent 54%)}
  .card.win{box-shadow:0 0 0 5px var(--sage);transform:scale(1.03)}

  .panel{border:2px solid var(--ink);border-radius:16px;background:var(--paper-2);
         padding:18px 20px}
  .panel h3{font-family:var(--display);font-size:25px;margin:0 0 12px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
           color:var(--ink-soft);margin:0 0 3px}

  .qlist{display:flex;flex-direction:column;gap:8px}
  .q{font-family:var(--body);font-size:18px;font-weight:600;background:#fff;
     color:var(--ink);border:2px solid var(--ink);border-radius:11px;
     padding:9px 16px;cursor:pointer;text-align:left;transition:transform .12s ease}
  .q:hover{transform:translateY(-2px)}
  .q:disabled{opacity:.28;cursor:default;transform:none;text-decoration:line-through}
  .q:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
  .q.guess{border-color:var(--sage);background:#EEF4E8}

  .bubble{position:relative;background:#fff;border:2px solid var(--terracotta);
          border-radius:14px;padding:13px 18px;font-size:21px;line-height:1.4;margin:0 0 16px}
  .bubble.bad{border-style:dashed;border-color:var(--ochre)}

  .secret{background:#fff;border:2px solid var(--sage);border-radius:12px;
          padding:12px 16px;margin:0 0 14px;text-align:center}
  .secret .lab{font-size:13px;letter-spacing:.12em;text-transform:uppercase;
          color:var(--ink-soft);font-weight:700}
  .secret .nm{font-family:var(--display);font-size:34px;line-height:1.1;color:var(--sage)}
  .secret img{width:120px;height:auto;border:2px solid var(--rule);border-radius:9px;margin-top:6px}

  .actions{display:flex;flex-wrap:wrap;gap:10px}
  .btn{font-family:var(--body);font-size:17px;font-weight:600;background:#fff;color:var(--ink);
       border:2px solid var(--ink);border-radius:11px;padding:10px 20px;cursor:pointer;
       transition:transform .12s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.35;cursor:default;transform:none}
  .btn.wide{flex:1 1 150px;text-align:center}
  .btn.yes{border-color:var(--sage)} .btn.no{border-color:var(--terracotta)}
  .btn.ghost{border-style:dashed;color:var(--ink-soft);font-weight:400}

  .verdict{display:flex;gap:11px;align-items:flex-start;border-radius:12px;
           padding:12px 15px;margin:14px 0 0;font-size:18px;line-height:1.45;
           animation:pop .28s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}}
  .verdict.good{background:#EEF4E8;border:2px solid var(--sage)}
  .verdict.bad{background:#F9EEE7;border:2px solid var(--terracotta)}
  .verdict .mark{font-size:22px;line-height:1.1;flex:none}
  .verdict b{display:block;font-family:var(--display);font-size:20px}

  .help{margin-top:14px;border:2px dashed var(--rule);border-radius:14px;
        background:var(--paper);padding:12px 16px}
  .help .now{margin:0;font-size:18px;line-height:1.35}
  .help details{margin:10px 0 0;border-top:1.5px solid var(--rule);padding-top:8px}
  .help summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);
        letter-spacing:.09em;text-transform:uppercase;list-style:none}
  .help summary::-webkit-details-marker{display:none}
  .help summary::before{content:"\25B8 "}
  .help details[open] summary::before{content:"\25BE "}
  .help ul{margin:8px 0 0;padding-left:18px;font-size:16px;line-height:1.45}
  .help li{margin:0 0 4px}

  .teacher{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px;
           padding-top:12px;border-top:2px solid var(--rule)}
  .teacher span{font-size:12px;color:var(--ink-soft);letter-spacing:.12em;
           text-transform:uppercase;font-weight:700;margin-right:2px}
  .teacher .btn{font-size:14px;padding:6px 13px;border-width:1.5px;
           border-color:var(--rule);font-weight:400}
  .teacher .btn.on{border-color:var(--sage);color:var(--ink)}

  @media (max-width:1080px){
    .stage{grid-template-columns:1fr}
    .grid{max-width:820px;margin:0 auto}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .card .nm{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .home{position:fixed;left:14px;top:14px;z-index:60;width:44px;height:44px;border-radius:50%;
        border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
        display:flex;align-items:center;justify-content:center;text-decoration:none;
        box-shadow:0 2px 5px rgba(58,54,50,.22);transition:transform .12s ease}
  .home:hover{transform:scale(1.08);background:#fff}
  .home svg{width:22px;height:22px;display:block}
  @media (max-width:760px){ .home{width:38px;height:38px;left:9px;top:9px} .home svg{width:19px;height:19px} }
</style>
</head>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round">

<div class="wrap">
  <header>
    <h1>Who is it?</h1>
    <div class="stars"><span class="who">Stars</span><span class="n" id="stars">0</span></div>
  </header>

  <div class="turn find" id="turnBar"><h2 id="turnText">Your turn to guess!</h2></div>

  <div class="stage">
    <div class="grid" id="grid"></div>
    <div>
      <div class="panel" id="panel"></div>
      <div class="help">
        <p class="now" id="helpNow"></p>
        <details>
          <summary>How to play</summary>
          <ul>
            <li>One friend is hiding. Ask questions to find them!</li>
            <li>Every <b>no</b> crosses out some friends.</li>
            <li>Then Bobo hides one, and <b>you</b> answer his questions.</li>
            <li>Careful &mdash; sometimes Bobo says it wrong. Tell him!</li>
          </ul>
        </details>
      </div>
      <div class="teacher">
        <span>Teacher</span>
        <button class="btn ghost on" id="btnSound">Sound on</button>
        <button class="btn ghost" id="btnSwap">Switch round</button>
        <button class="btn ghost" id="btnNew">New game</button>
      </div>
    </div>
  </div>
</div>

let AC=null, soundOn=true;
function ac(){ if(!AC){const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null; try{AC=new C();}catch(e){return null;}}
  if(AC.state==='suspended') AC.resume(); return AC; }
function note(f0,t0,dur,o){ o=o||{}; const c=ac(); if(!c) return;
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'triangle';
  const t=c.currentTime+t0, gain=o.gain||0.14;
  osc.frequency.setValueAtTime(f0,t);
  if(o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t+dur+0.05); }

                    note(659,.20,.11,{gain:.12}); note(784,.30,.26,{gain:.14}); }
};
function sfx(k){ if(soundOn&&SFX[k]) try{SFX[k]();}catch(e){} }

/* ---------------- questions ---------------- */
const QS = [
  {t:'Is it a badger?',    f:c=>c.s==='badger',   y:'Yes, it is.',  n:"No, it isn't.",
   bad:'It is a badger?'},
  {t:'Is it a hedgehog?',  f:c=>c.s==='hedgehog', y:'Yes, it is.',  n:"No, it isn't.",
   bad:'Is it a hedgehogs?'},
  {t:'Is it a rabbit?',    f:c=>c.s==='rabbit',   y:'Yes, it is.',  n:"No, it isn't.",
   bad:'Is it rabbit?'},
  {t:'Is it a squirrel?',  f:c=>c.s==='squirrel', y:'Yes, it is.',  n:"No, it isn't.",
   bad:'It is a squirrel?'},
  {t:'Is it reading?',     f:c=>c.a==='reading',  y:'Yes, it is.',  n:"No, it isn't.",
   bad:'Is it read?'},
  {t:'Is it sleeping?',    f:c=>c.a==='sleeping', y:'Yes, it is.',  n:"No, it isn't.",
   bad:'Is it sleep?'},
  {t:'Has it got glasses?',f:c=>!!c.g,            y:'Yes, it has.', n:"No, it hasn't.",
   bad:'Has it got the glasses?'},
  {t:'Has it got a hat?',  f:c=>!!c.h,            y:'Yes, it has.', n:"No, it hasn't.",
   bad:'It has got a hat?'}
];

/* ---------------- state ---------------- */
let mode, secret, alive, asked, stars=0, boboQ=null, boboBad=false;

function reset(full){
  if(full) stars=0;
  mode='find'; startRound();
  sfx('start');
}

function startRound(){
  secret = FRIENDS[Math.floor(Math.random()*FRIENDS.length)];
  alive = FRIENDS.map(f=>f.n);
  asked = [];
  boboQ = null;
  drawGrid(); drawBar(); drawPanel();
}

function drawGrid(){
  const g=document.getElementById('grid');
  g.innerHTML = FRIENDS.map(function(f){
    const out = alive.indexOf(f.n)===-1;
    const win = mode==='find' && alive.length===1 && alive[0]===f.n;
    return '<div class="card'+(out?' out':'')+(win?' win':'')+'" id="c-'+f.n+'">'+
           '<img src="'+f.img+'" alt="'+f.n+'"><span class="nm">'+f.n+'</span></div>';
  }).join('');
}

function drawBar(){
  const b=document.getElementById('turnBar');
  b.className = 'turn '+(mode==='find'?'find':'answer');
  document.getElementById('turnText').textContent =
    mode==='find' ? 'Your turn to guess!' : "Bobo's turn to guess!";
  document.getElementById('stars').textContent = stars;
}

/* ---------------- round A : Sophia cherche ---------------- */
function drawPanel(){
  const p=document.getElementById('panel');
  if(mode==='find'){
    if(alive.length===1){
      const f=FRIENDS.filter(x=>x.n===alive[0])[0];
      p.innerHTML='<p class="eyebrow">You found it</p><h3>It is '+f.n+'!</h3>'+
        '<div class="actions"><button class="btn wide yes" id="next">Bobo hides one now</button></div>';
      document.getElementById('next').onclick=function(){ mode='answer'; startRound(); };
      award();
      help('You found the hidden friend! Now Bobo hides one.');
      return;
    }
    p.innerHTML='<p class="eyebrow">Ask a question</p><h3>Say it out loud!</h3>'+
      '<div class="qlist">'+QS.map(function(q,i){
        return '<button class="q" data-i="'+i+'"'+(asked.indexOf(i)>=0?' disabled':'')+'>'+q.t+'</button>';
      }).join('')+
      '<button class="q guess" id="iknow">I know who it is!</button></div>';
    p.querySelectorAll('.q[data-i]').forEach(function(b){
      b.onclick=function(){ askQuestion(+b.dataset.i); };
    });
    document.getElementById('iknow').onclick=guessList;
    help('Say a question out loud, then tap it. '+
         alive.length+' friends left.');
  } else {
    drawBoboPanel();
  }
}

function guessList(){
  const p=document.getElementById('panel');
  p.innerHTML='<p class="eyebrow">Say the whole sentence</p><h3>It is &hellip;</h3>'+
    '<div class="qlist">'+alive.map(function(n){
      return '<button class="q" data-n="'+n+'">It is '+n+'!</button>';}).join('')+
    '<button class="q" id="back" style="border-style:dashed;color:#7C766D">Ask more questions</button></div>';
  p.querySelectorAll('.q[data-n]').forEach(function(b){ b.onclick=function(){ tryGuess(b.dataset.n); }; });
  document.getElementById('back').onclick=drawPanel;
  help('Say it out loud: It is BIBI! Then tap.');
}
function tryGuess(n){
  const p=document.getElementById('panel');
  if(n===secret.n){ alive=[n]; drawGrid(); drawPanel(); return; }
  alive=alive.filter(function(x){return x!==n;}); drawGrid(); sfx('no');
  p.innerHTML='<p class="eyebrow">Not this one</p><h3>It is not '+n+'.</h3>'+
    '<div class="verdict bad"><span class="mark">&#10006;</span><div><b>Try again!</b>'+alive.length+' friends left.</div></div>'+
    '<div class="actions" style="margin-top:14px"><button class="btn wide" id="go">Keep going</button></div>';
  document.getElementById('go').onclick=drawPanel;
  help('Not this one. Ask another question or try again.');
}

function askQuestion(i){
  const q=QS[i], yes=q.f(secret);
  asked.push(i);
  const before=alive.length;
  alive = alive.filter(function(n){
    const f=FRIENDS.filter(x=>x.n===n)[0];
    return q.f(f)===yes;
  });
  sfx(yes?'yes':'no');
  drawGrid();
  const gone=before-alive.length;
  const p=document.getElementById('panel');
  p.innerHTML='<p class="eyebrow">You asked</p><h3>'+q.t+'</h3>'+
    '<div class="bubble">'+(yes?q.y:q.n)+'</div>'+
    '<div class="verdict '+(yes?'good':'bad')+'"><span class="mark">'+(yes?'&#10004;':'&#10006;')+
    '</span><div><b>'+(gone?gone+' friends are out!':'Nobody is out.')+'</b>'+
    alive.length+' friends left.</div></div>'+
    '<div class="actions" style="margin-top:14px"><button class="btn wide" id="go">Ask another one</button></div>';
  document.getElementById('go').onclick=drawPanel;
  if(gone) setTimeout(function(){ sfx('out'); }, 250);
  help(alive.length===1 ? 'Only one friend left. Who is it?'
                        : 'Keep going! '+alive.length+' friends left.');
}

/* ---------------- round B : Bobo cherche ---------------- */
function drawBoboPanel(){
  const p=document.getElementById('panel');
  const useful = QS.map(function(q,i){return i;}).filter(function(i){
    const y=alive.filter(function(n){return QS[i].f(FRIENDS.filter(x=>x.n===n)[0]);}).length;
    return y>0 && y<alive.length && asked.indexOf(i)===-1;
  });

  if(alive.length===1){
    p.innerHTML='<p class="eyebrow">Bobo says</p><h3>It is '+alive[0]+'!</h3>'+
      '<div class="bubble">He found your friend. Well played!</div>'+
      '<div class="actions"><button class="btn wide yes" id="next">Play again</button></div>';
    document.getElementById('next').onclick=function(){ mode='find'; startRound(); };
    help('Bobo found it. Your turn to hide one again!');
    return;
  }
  if(!useful.length){ alive=[secret.n]; drawGrid(); drawBoboPanel(); return; }

  const i = useful[Math.floor(Math.random()*useful.length)];
  boboQ = i;
  boboBad = Math.random() < 0.34;
  const q = QS[i];

  p.innerHTML =
    '<div class="secret"><span class="lab">Your secret friend</span>'+
      '<div class="nm">'+secret.n+'</div>'+
      '<img src="'+secret.img+'" alt=""></div>'+
    '<p class="eyebrow">Bobo asks</p>'+
    '<div class="bubble'+(boboBad?' bad':'')+'" id="bub">'+(boboBad?q.bad:q.t)+'</div>'+
    (boboBad
      ? '<div class="actions"><button class="btn wide no" id="fix">Bobo, say it again!</button></div>'
      : '<div class="actions">'+
        '<button class="btn wide yes" data-v="1">'+q.y+'</button>'+
        '<button class="btn wide no" data-v="0">'+q.n+'</button></div>');

  setTimeout(function(){ sfx('bobo'); }, 220);

  if(boboBad){
    help('Careful! Bobo said it wrong. Tell him the right question.');
    document.getElementById('fix').onclick=function(){
      sfx('yes'); stars++; drawBar();
      document.getElementById('bub').className='bubble';
      document.getElementById('bub').textContent=q.t;
      const a=p.querySelector('.actions');
      a.innerHTML='<button class="btn wide yes" data-v="1">'+q.y+'</button>'+
                  '<button class="btn wide no" data-v="0">'+q.n+'</button>';
      bindAnswers(p,i);
      help('Well done! Now answer Bobo.');
    };
  } else {
    help('Answer Bobo out loud, then tap.');
    bindAnswers(p,i);
  }
}

function bindAnswers(p,i){
  const q=QS[i];
  p.querySelectorAll('[data-v]').forEach(function(b){
    b.onclick=function(){
      const said = b.dataset.v==='1';
      const truth = q.f(secret);
      if(said!==truth){
        sfx('oops');
        const v=document.createElement('div');
        v.className='verdict bad';
        v.innerHTML='<span class="mark">&#9998;</span><div><b>Look again!</b>'+
                    'Look at '+secret.n+' carefully.</div>';
        p.appendChild(v);
        p.querySelectorAll('[data-v]').forEach(function(x){x.disabled=true;});
        setTimeout(function(){ drawBoboPanel(); }, 2200);
        return;
      }
      sfx(truth?'yes':'no');
      asked.push(i);
      alive = alive.filter(function(n){
        return q.f(FRIENDS.filter(x=>x.n===n)[0])===truth;
      });
      drawGrid();
      setTimeout(function(){ drawBoboPanel(); }, 900);
    };
  });
}

function award(){ stars++; drawBar(); sfx('star'); }
function help(t){ document.getElementById('helpNow').textContent=t; }

/* ---------------- teacher ---------------- */
document.getElementById('btnSound').onclick=function(){
  soundOn=!soundOn; this.textContent=soundOn?'Sound on':'Sound off';
  this.classList.toggle('on',soundOn); if(soundOn) sfx('yes');
};
document.getElementById('btnSwap').onclick=function(){
  mode = mode==='find' ? 'answer' : 'find'; startRound();
};
document.getElementById('btnNew').onclick=function(){
  if(confirm('New game? The stars go back to zero.')) reset(true);
};

reset(true);
</script>
</body>
</html>
