<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Map</title>
<style>
  :root{--paper:#FCFAF6;--paper-2:#F5F1E8;--ink:#3A3632;--ink-soft:#7C766D;--rule:#DCD5C6;
        --sage:#6E8B5A;--ochre:#B5871F;
        --display:'Bradley Hand','Chalkboard SE','Comic Sans MS','Segoe Print','Ink Free',cursive;
        --body:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:40px}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 26px 70px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
         padding-bottom:10px;border-bottom:2px solid var(--ink)}
  h1{font-family:var(--display);font-size:clamp(30px,5vw,46px);margin:0;line-height:1.05}
  .count{display:flex;align-items:center;gap:11px;background:var(--paper-2);
         border:2.5px solid var(--ochre);border-radius:14px;padding:6px 18px}
  .count .n{font-family:var(--display);font-size:34px;line-height:.9}
  .count .lab{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .board{position:relative;margin:18px 0 0;border:2px solid var(--ink);border-radius:14px;
         overflow:hidden;line-height:0;background:#fff}
  .board img{width:100%;height:auto;display:block}
  .cell{position:absolute;border-radius:3px;transition:opacity .5s ease}
  .cell.locked{background:rgba(252,250,246,.80);backdrop-filter:saturate(.2) blur(1px)}
  .cell.done{box-shadow:inset 0 0 0 3px var(--sage)}
  .cell .tick{position:absolute;right:6%;top:6%;width:26px;height:26px;border-radius:50%;
        background:var(--sage);color:#fff;font-size:15px;display:flex;align-items:center;
        justify-content:center;border:2px solid #fff;line-height:1}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:20px}
  .item{border:2px solid var(--rule);border-radius:12px;padding:10px 14px;background:#fff}
  .item.done{border-color:var(--sage);background:#F4F8F1}
  .item b{display:block;font-family:var(--display);font-size:19px;line-height:1.15}
  .item span{font-size:14px;color:var(--ink-soft)}
  .back{display:inline-block;margin-top:22px;text-decoration:none;color:var(--ink-soft);
        border:2px dashed var(--rule);border-radius:11px;padding:9px 18px;font-size:16px}
  .back:hover{color:var(--ink);border-color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .home{position:fixed;left:14px;top:14px;z-index:60;width:44px;height:44px;border-radius:50%;
        border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
        display:flex;align-items:center;justify-content:center;text-decoration:none;
        box-shadow:0 2px 5px rgba(58,54,50,.22);transition:transform .12s ease}
  .home:hover{transform:scale(1.08);background:#fff}
  .home svg{width:22px;height:22px;display:block}
  @media (max-width:760px){ .home{width:38px;height:38px;left:9px;top:9px} .home svg{width:19px;height:19px} }
</style>
</head>
