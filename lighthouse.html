body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(15,26,44,.15) 0%,rgba(15,26,44,.55) 30%,rgba(15,26,44,.78) 55%,rgba(15,26,44,.82) 100%);
}
body{
  background:radial-gradient(120% 90% at 50% 0%,#22354f 0%,var(--night) 45%,var(--deep) 100%);
  color:var(--pale);
  font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#top{
  position:fixed;top:0;left:0;right:0;height:62px;z-index:10;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(15,26,44,.92);border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
#home{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  text-decoration:none;color:var(--soft);flex:0 0 auto;
}
#tabs{display:flex;gap:7px;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  white-space:nowrap;font-size:14.5px;color:var(--soft);
}
.tab.on{background:var(--lamp);border-color:var(--lamp);color:#16233a;font-weight:600}
#gear{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  color:var(--soft);flex:0 0 auto;font-size:16px}

#panel{
  position:fixed;top:66px;right:12px;z-index:20;display:none;width:250px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:13.5px;color:var(--soft);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}
#panel.on{display:block}
#panel .row{display:flex;align-items:center;gap:10px;margin:8px 0}
#panel input[type=range]{flex:1;accent-color:var(--lamp)}
#panel button{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);
  border-radius:8px;background:rgba(255,255,255,.04);font-size:13.5px}

#stage{position:fixed;z-index:1;top:62px;left:0;right:0;bottom:0;overflow-y:auto;padding:22px 16px 60px}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:1;background:rgba(15,26,44,.72);border:1px solid rgba(242,193,78,.22);border-radius:18px;padding:26px 22px 30px;backdrop-filter:blur(3px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
#say{text-align:center;font-size:clamp(17px,2.2vw,21px);color:var(--lamp);
  margin:0 0 22px;min-height:30px;font-weight:600}
#say small{display:block;font-size:13px;color:var(--soft);font-weight:400;margin-top:5px;letter-spacing:.04em}

.sentence{
  font-size:clamp(19px,2.8vw,27px);line-height:1.9;text-align:center;
  margin:8px auto 26px;max-width:720px;
}
.tok{display:inline-block;padding:3px 7px;border-radius:8px;margin:0 1px}
.tok.click{border:1px dashed var(--line);cursor:pointer;transition:background .12s}
.tok.click:hover{background:rgba(242,193,78,.12)}
.tok.gap{border:2px dashed var(--lamp);color:var(--lamp);min-width:96px;text-align:center}
.tok.fixed{border:2px solid var(--go);color:var(--go)}
.tok.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

.onepic{display:flex;justify-content:center;margin:0 0 4px}
.onepic img{width:min(170px,40vw);height:min(170px,40vw);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.opts{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:8px}
.opt{
  padding:13px 22px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);font-size:clamp(16px,2vw,20px);
  transition:transform .1s,border-color .12s,background .12s;
}
.opt:hover{background:rgba(242,193,78,.12)}
.opt:active{transform:scale(.96)}
.opt.bad{animation:shake .4s;border-color:var(--bad)}
.opt.good{animation:pop .4s;border-color:var(--go);color:var(--go)}
.opt.done{opacity:.25;pointer-events:none}

/* relier */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;max-width:760px;margin:0 auto}
.cell{
  padding:13px 15px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);font-size:clamp(14.5px,1.8vw,17px);
  transition:transform .1s,border-color .12s,background .12s;text-align:left;
}
.cell:hover{background:rgba(242,193,78,.1)}
.cell.sel{border-color:var(--lamp);background:rgba(242,193,78,.16)}
.cell.done{opacity:.25;pointer-events:none;border-color:var(--go)}
.cell.bad{animation:shake .4s}
.cell.withpic{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px}
.cell.withpic img{width:78px;height:78px;border-radius:9px;object-fit:cover;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.colhead{font-size:12.5px;letter-spacing:.1em;color:var(--soft);text-transform:uppercase;margin-bottom:4px}

/* remettre en ordre */
.slots{max-width:600px;margin:0 auto 18px}
.slot{
  border:2px dashed var(--line);border-radius:12px;padding:12px 15px;margin:8px 0;
  color:var(--soft);font-size:15px;min-height:50px;display:flex;align-items:center;gap:12px;
}
.slot.filled{border-style:solid;border-color:var(--go);color:var(--pale)}
.slot b{color:var(--lamp);flex:0 0 auto}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.step{
  padding:12px 18px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);font-size:15.5px;max-width:300px;text-align:left;
}
.step:hover{background:rgba(242,193,78,.1)}
.step.bad{animation:shake .4s;border-color:var(--bad)}
.step.done{display:none}

@media (min-width:1000px){.wrap{margin:0 4vw 0 auto}}
#next{
  display:none;margin:30px auto 0;padding:14px 40px;border-radius:999px;
  background:var(--lamp);color:#16233a;font-size:18px;font-weight:600;
}
#next.on{display:block}
#hint{text-align:center;color:var(--soft);font-size:14px;margin-top:20px;min-height:20px}
</style>
</head>

/* ------------------------------------------------------------ audio */
let AC=null,GAIN=null,vol=.7;
function actx(){ if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  GAIN=AC.createGain();GAIN.gain.value=vol;GAIN.connect(AC.destination);}
function tone(f,d,t,v,to){ if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=t||'sine';o.frequency.value=f;
  if(to)o.frequency.exponentialRampToValueAtTime(to,AC.currentTime+d);
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(v||.22,AC.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(GAIN);o.start();o.stop(AC.currentTime+d+.02);}
const S={
  tap(){tone(560,.05,'sine',.12);},
  good(){tone(660,.1,'sine',.2);setTimeout(()=>tone(880,.15,'sine',.18),90);},
  nope(){tone(200,.12,'triangle',.14,155);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.24,'sine',.18),i*105));}
};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function tabs(){
  const t=$('tabs');t.innerHTML='';
  KEYS.forEach(k=>{
    const b=el('button','tab'+(k===cur?' on':''),GAME[k].title);
    b.onclick=()=>{actx();cur=k;idx=0;round=0;draw();};
    t.appendChild(b);
  });
}

    const t=GAME[cur];
    if(last){idx=0;round=0;}
    else if(t.kind==='match'||t.kind==='order')round++;
    else idx++;
    draw();};
}
function draw(){
  tabs();sel=null;$('next').classList.remove('on');$('hint').textContent='';
  const t=GAME[cur];
  if(t.kind==='fix')return drawFix(t);
  if(t.kind==='gap')return drawGap(t);
  if(t.kind==='match')return drawMatch(t);
  if(t.kind==='order')return drawOrder(t);
}

/* ------------------------------------------------------- corriger */
function drawFix(t){
  if(idx>=t.items.length)idx=0;
  const [toks,badI,opts,ans]=t.items[idx];
  $('say').innerHTML=t.prompt+'<small>'+(idx+1)+' / '+t.items.length+'</small>';
  const b=$('board');b.innerHTML='';
  const s=el('div','sentence');s.id='sen';
  toks.forEach((tok,i)=>{
    const e=el('span','tok click',tok);
    e.onclick=()=>{actx();
      if(i===badI){S.good();e.className='tok gap';e.textContent='?';e.id='slot';step2();}
      else{S.nope();e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),400);}
    };
    s.appendChild(e);
  });
  b.appendChild(s);
  function step2(){
    $('say').innerHTML='Now choose the right word.';
    document.querySelectorAll('#sen .tok.click').forEach(e=>{e.className='tok';e.onclick=null;});
    const o=el('div','opts');
    shuffle(opts).forEach(op=>{
      const x=el('button','opt',op);
      x.onclick=()=>{actx();
        if(op===ans){S.good();const g=$('slot');g.textContent=op;g.className='tok fixed';
          x.classList.add('good');setTimeout(()=>done('Corrected.',idx>=t.items.length-1),650);}
        else{S.nope();x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);}
      };
      o.appendChild(x);
    });
    b.appendChild(o);
  }
}

/* ------------------------------------------------------- trou */
function drawGap(t){
  if(idx>=t.items.length)idx=0;
  const [sen,ans,opts,pic]=t.items[idx];
  $('say').innerHTML=t.prompt+'<small>'+(idx+1)+' / '+t.items.length+'</small>';
  const b=$('board');b.innerHTML='';
  if(pic&&PIX[pic]){const o=el('div','onepic');const im=el('img');im.src=PIX[pic];im.alt='';o.appendChild(im);b.appendChild(o);}
  const s=el('div','sentence');
  sen.split(' ').forEach(tok=>{
    if(tok.indexOf('___')>=0){const g=el('span','tok gap','?');g.id='slot';s.appendChild(g);
      s.appendChild(document.createTextNode(' '));}
    else{s.appendChild(el('span','tok',tok));s.appendChild(document.createTextNode(' '));}
  });
  b.appendChild(s);
  const o=el('div','opts');
  shuffle(opts).forEach(op=>{
    const x=el('button','opt',op);
    x.onclick=()=>{actx();
      if(op===ans){S.good();const g=$('slot');g.textContent=op;g.className='tok fixed';
        x.classList.add('good');setTimeout(()=>done('Yes.',idx>=t.items.length-1),650);}
      else{S.nope();x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);}
    };
    o.appendChild(x);
  });
  b.appendChild(o);
}

/* ------------------------------------------------------- relier */
function drawMatch(t){
  if(round>=t.rounds.length)round=0;
  const pairs=t.rounds[round];
  $('say').innerHTML=t.prompt+'<small>'+(round+1)+' / '+t.rounds.length+'</small>';
  const b=$('board');b.innerHTML='';
  const g=el('div','cols');
  const L=el('div'),R=el('div');
  L.appendChild(el('div','colhead',t.left));
  R.appendChild(el('div','colhead',t.right));
  let left=0;
  pairs.forEach(p=>{
    const c=el('button','cell'+(p[2]?' withpic':''));c.dataset.k=p[1];
    if(p[2]){const im=el('img');im.src=PIX[p[2]];im.alt='';c.appendChild(im);}
    c.appendChild(el('span',null,p[0]));
    c.onclick=()=>{actx();S.tap();
      document.querySelectorAll('.cell.sel').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');sel=c;};
    L.appendChild(c);left++;
  });
  shuffle(pairs).forEach(p=>{
    const c=el('button','cell',p[1]);
    c.onclick=()=>{actx();
      if(!sel){S.tap();c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),400);
        $('hint').textContent='Choose a problem on the left first.';return;}
      if(sel.dataset.k===p[1]){
        S.good();const s=sel;s.classList.add('done');c.classList.add('done');sel=null;
        $('hint').textContent='';left--;
        if(left<=0)setTimeout(()=>done('All matched.',round>=t.rounds.length-1),600);
      }else{S.nope();c.classList.add('bad');sel.classList.add('bad');
        const s=sel;setTimeout(()=>{c.classList.remove('bad');s.classList.remove('bad');},400);}
    };
    R.appendChild(c);
  });
  g.appendChild(L);g.appendChild(R);b.appendChild(g);
}

/* ------------------------------------------------------- ordre */
function drawOrder(t){
  if(round>=t.rounds.length)round=0;
  const [q,steps]=t.rounds[round];
  $('say').innerHTML=q+'<small>'+t.prompt+' — '+(round+1)+' / '+t.rounds.length+'</small>';
  const b=$('board');b.innerHTML='';
  const sl=el('div','slots');
  steps.forEach((_,i)=>{
    const s=el('div','slot');s.id='slot'+i;
    s.appendChild(el('b',null,(i+1)+'.'));
    s.appendChild(el('span',null,''));
    sl.appendChild(s);
  });
  b.appendChild(sl);
  const pool=el('div','pool');
  let want=0;
  shuffle(steps).forEach(st=>{
    const x=el('button','step',st);
    x.onclick=()=>{actx();
      if(st===steps[want]){
        S.good();const s=$('slot'+want);
        s.lastChild.textContent=st;s.classList.add('filled');
        x.classList.add('done');want++;
        if(want>=steps.length)setTimeout(()=>done('That is the right order.',round>=t.rounds.length-1),650);
      }else{S.nope();x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);}
    };
    pool.appendChild(x);
  });
  b.appendChild(pool);
}

/* ------------------------------------------------------------ events */
$('gear').onclick=e=>{e.stopPropagation();$('panel').classList.toggle('on');};
$('vol').oninput=e=>{vol=e.target.value/100;if(GAIN)GAIN.gain.value=vol;};
$('skip').onclick=()=>{actx();const t=GAME[cur];
  if(t.kind==='match'||t.kind==='order')round=(round+1)%t.rounds.length;
  else idx=(idx+1)%t.items.length;
  $('panel').classList.remove('on');draw();};
$('again').onclick=()=>{idx=0;round=0;$('panel').classList.remove('on');draw();};
document.addEventListener('click',e=>{
  if(!$('panel').contains(e.target)&&e.target!==$('gear'))$('panel').classList.remove('on');});

draw();
</script>
</body>
