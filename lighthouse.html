<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Lighthouse</title>
<style>
:root{
  --night:#16233a; --deep:#0f1a2c; --panel:#1f3050; --line:#2f4570;
  --lamp:#f2c14e; --warm:#e8a33d; --pale:#e9edf5; --soft:#9fb0cb;
  --go:#4fb894; --bad:#d8705f;
  --bar:rgba(15,26,44,.92); --wrap:rgba(15,26,44,.72); --wrapline:rgba(242,193,78,.22);
  --card:rgba(255,255,255,.05); --hov:rgba(242,193,78,.12); --tabfg:#16233a;
  --shadow:rgba(0,0,0,.4); --tint:rgba(242,193,78,.12);
}
body[data-tone=light]{
  --panel:#fff8ec; --line:rgba(46,60,96,.34);
  --lamp:#9c5a0a; --pale:#25304b; --soft:#56627f;
  --go:#23855f; --bad:#bd4d3a;
  --bar:rgba(255,250,241,.84); --wrap:rgba(255,251,244,.8); --wrapline:rgba(156,90,10,.32);
  --card:rgba(255,255,255,.62); --hov:rgba(214,146,52,.2); --tabfg:#fff;
  --shadow:rgba(60,40,10,.22); --tint:rgba(214,146,52,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#0f1a2c;color:var(--pale);
  font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* fonds : deux calques en fondu enchaîné d'une seconde, chacun avec son voile */
#bgs{position:fixed;inset:0;z-index:0;background:#0f1a2c}
.bg{position:absolute;inset:0;background:#0f1a2c left center/cover no-repeat;opacity:0;transition:opacity 1s ease}
.bg.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:var(--veil);transition:opacity 1s ease}
body.dawn .bg::after{opacity:0;transition:opacity 4s ease}
body.dawn .bg.on{filter:brightness(1.05) saturate(1.06)}

#top,#home,#gear,.tab,.wrap,#say,#hint{transition:background-color 1s ease,color 1s ease,border-color 1s ease}
#top{
  position:fixed;top:0;left:0;right:0;height:62px;z-index:10;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--bar);border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
#home{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  text-decoration:none;color:var(--soft);flex:0 0 auto;
}
#tabs{display:flex;gap:7px;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  white-space:nowrap;font-size:14.5px;color:var(--soft);
}
.tab.on{background:var(--lamp);border-color:var(--lamp);color:var(--tabfg);font-weight:600}
.tab.locked{opacity:.4;cursor:default;pointer-events:none}
.tab .lock{width:12px;height:12px;margin-left:7px;vertical-align:-1px;fill:currentColor}
.tab.pop{animation:pop .7s}
#gear{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  color:var(--soft);flex:0 0 auto;font-size:16px}

#panel{
  position:fixed;top:66px;right:12px;z-index:20;display:none;width:250px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:13.5px;color:var(--soft);
  box-shadow:0 10px 30px var(--shadow);
}
#panel.on{display:block}
#panel .row{display:flex;align-items:center;gap:10px;margin:8px 0}
#panel .row span{flex:0 0 74px}
#panel input[type=range]{flex:1;accent-color:var(--lamp)}
#panel button{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);font-size:13.5px;color:var(--pale)}

#stage{position:fixed;z-index:1;top:62px;left:0;right:0;bottom:0;overflow-y:auto;padding:22px 16px 60px}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:1;background:var(--wrap);border:1px solid var(--wrapline);border-radius:18px;padding:26px 22px 30px;backdrop-filter:blur(3px);box-shadow:0 12px 40px var(--shadow)}
body.dawn .wrap{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}
#say{text-align:center;font-size:clamp(17px,2.2vw,21px);color:var(--lamp);
  margin:0 0 22px;min-height:30px;font-weight:600}
#say small{display:block;font-size:13px;color:var(--soft);font-weight:400;margin-top:5px;letter-spacing:.04em}

.sentence{
  font-size:clamp(19px,2.8vw,27px);line-height:1.9;text-align:center;
  margin:8px auto 26px;max-width:720px;
}
.tok{display:inline-block;padding:3px 7px;border-radius:8px;margin:0 1px}
.tok.click{border:1px dashed var(--line);cursor:pointer;transition:background .12s}
.tok.click:hover{background:var(--hov)}
.tok.gap{border:2px dashed var(--lamp);color:var(--lamp);min-width:96px;text-align:center}
.tok.fixed{border:2px solid var(--go);color:var(--go)}
.tok.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.onepic{display:flex;justify-content:center;margin:0 0 4px}
.onepic img{width:min(170px,40vw);height:min(170px,40vw);border-radius:14px;box-shadow:0 6px 20px var(--shadow)}
.opts{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:8px}
.opt{
  padding:13px 22px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:clamp(16px,2vw,20px);
  transition:transform .1s,border-color .12s,background .12s;
}
.opt:hover{background:var(--hov)}
.opt:active{transform:scale(.96)}
.opt.bad{animation:shake .4s;border-color:var(--bad)}
.opt.good{animation:pop .4s;border-color:var(--go);color:var(--go)}
.opt.done{opacity:.25;pointer-events:none}

/* relier */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;max-width:760px;margin:0 auto}
.cell{
  display:block;width:100%;margin:0 0 10px;
  padding:13px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:clamp(14.5px,1.8vw,17px);
  transition:transform .1s,border-color .12s,background .12s;text-align:left;
}
.cell:hover{background:var(--hov)}
.cell.sel{border-color:var(--lamp);background:var(--tint)}
.cell.done{opacity:.25;pointer-events:none;border-color:var(--go)}
.cell.bad{animation:shake .4s}
.cell.withpic{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px}
.cell.withpic img{width:78px;height:78px;border-radius:9px;object-fit:cover;flex:0 0 auto;box-shadow:0 2px 8px var(--shadow)}
.colhead{font-size:12.5px;letter-spacing:.1em;color:var(--soft);text-transform:uppercase;margin-bottom:4px}

/* remettre en ordre */
.slots{max-width:600px;margin:0 auto 18px}
.slot{
  border:2px dashed var(--line);border-radius:12px;padding:12px 15px;margin:8px 0;
  color:var(--soft);font-size:15px;min-height:50px;display:flex;align-items:center;gap:12px;
}
.slot.filled{border-style:solid;border-color:var(--go);color:var(--pale)}
.slot b{color:var(--lamp);flex:0 0 auto}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.step{
  padding:12px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:15.5px;max-width:300px;text-align:left;
}
.step:hover{background:var(--hov)}
.step.bad{animation:shake .4s;border-color:var(--bad)}
.step.done{display:none}

/* désigner : quatre cartes d'outils */
.picks{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:4px}
.pcard{padding:0;border-radius:16px;transition:opacity .2s}
.pcard img{display:block;width:min(150px,38vw);height:min(150px,38vw);border-radius:16px;
  box-shadow:0 6px 20px var(--shadow);transition:transform .12s}
.pcard:hover img{transform:translateY(-3px)}
.pcard.bad{animation:shake .4s}
.pcard.good{animation:pop .4s}
.pcard.good img{outline:3px solid var(--go);outline-offset:2px}
.pcard.done{opacity:.28;pointer-events:none}

/* déduire : quatre suspects, un indice */
.what{text-align:center;font-size:clamp(18px,2.4vw,24px);font-weight:700;margin:0 0 16px}
.suspects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scard{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 10px 13px;
  border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;line-height:1.35;text-align:center;
  transition:transform .1s,border-color .12s,background .12s,opacity .2s;
}
.scard img{width:100%;max-width:150px;aspect-ratio:1/1;border-radius:12px;box-shadow:0 5px 16px var(--shadow)}
.scard:hover{background:var(--hov)}
.scard.bad{animation:shake .4s;border-color:var(--bad)}
.scard.good{animation:pop .4s;border-color:var(--go);border-width:2px}
.scard.dim{opacity:.4;pointer-events:none}
.clue{margin:16px 0 0;padding:12px 16px;border-radius:12px;border:1px solid var(--lamp);
  border-left-width:6px;background:var(--tint);font-size:clamp(15px,1.9vw,18px)}
.clue b{display:block;color:var(--lamp);font-size:13px;letter-spacing:.06em;margin-bottom:2px}
.why{margin:16px 0 0;padding:14px 16px;border-radius:12px;border:1px solid var(--go);
  background:rgba(79,184,148,.14);font-size:clamp(15px,1.9vw,18px);animation:rise .5s ease both}
.why p{margin:0}
.why .tell{margin-top:10px;font-style:italic;color:var(--soft)}
@media (max-width:720px){.suspects{grid-template-columns:repeat(2,1fr)}}

@media (min-width:1000px){.wrap{margin:0 4vw 0 auto}}
#next{
  display:none;margin:30px auto 0;padding:14px 40px;border-radius:999px;
  background:var(--lamp);color:var(--tabfg);font-size:18px;font-weight:600;
}
#next.on{display:block}
#hint{text-align:center;color:var(--soft);font-size:14px;margin-top:20px;min-height:20px}

/* la fin : calme, sans score */
.ending{text-align:center;padding:34px 8px 10px}
.ending p{margin:.12em 0;font-size:clamp(26px,4.4vw,48px);font-weight:600;color:var(--pale);
  text-shadow:0 0 22px rgba(255,255,255,.75);animation:rise 2.6s ease both}
.ending p+p{animation-delay:1.1s}
.ending button{margin:34px auto 0;display:block;padding:12px 34px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:16px;animation:rise 2s ease 2.8s both}

/* l'écran d'ouverture */
#cover{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:flex-end;padding:0 8vw}
.covbox{display:flex;flex-direction:column;align-items:center;gap:36px;margin-top:17vh;text-align:center}
#cover h1{margin:0;font-size:clamp(38px,7.4vw,108px);line-height:1;font-weight:700;color:#f2c14e;
  text-shadow:0 0 34px rgba(242,193,78,.42),0 3px 12px rgba(6,12,26,.7)}
#enter{padding:20px 62px;border-radius:999px;background:#f2c14e;color:#16233a;
  font-size:clamp(22px,2.6vw,30px);font-weight:700;
  box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 28px rgba(242,193,78,.38);transition:transform .12s}
#enter:hover{transform:scale(1.04)}
#enter:active{transform:scale(.98)}
body[data-screen=cover] #cover{display:flex}
body[data-screen=cover] #stage{display:none}
body[data-screen=cover] #tabs{visibility:hidden}
body[data-screen=cover] #top{background:transparent;border-bottom-color:transparent;backdrop-filter:none}
body[data-screen=cover] #home,body[data-screen=cover] #gear{background:rgba(15,26,44,.55);color:#e9edf5;border-color:rgba(233,237,245,.35)}
/* le verrou d'entrée : un cadenas, un champ, une flèche — aucun mot */
#gate{display:none;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:999px;
  background:rgba(15,26,44,.72);border:1px solid rgba(242,193,78,.45);
  box-shadow:0 8px 28px rgba(0,0,0,.45);backdrop-filter:blur(4px)}
body.gate #enter{display:none}
body.gate #gate{display:flex;animation:rise .4s ease both}
body.gate #gate.bad{animation:shake .4s}
#gate .glock{width:26px;height:26px;fill:#f2c14e;flex:0 0 auto}
#pass{width:min(46vw,230px);padding:12px 16px;border-radius:999px;border:1px solid rgba(233,237,245,.35);
  background:rgba(255,255,255,.08);color:#e9edf5;font:inherit;font-size:22px;letter-spacing:.18em;
  outline:none;-webkit-text-security:disc}
#pass:focus{border-color:#f2c14e}
#passgo{width:54px;height:54px;border-radius:50%;background:#f2c14e;color:#16233a;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(242,193,78,.38)}
#passgo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px),(max-aspect-ratio:1/1){
  #cover{justify-content:center;align-items:flex-end;padding:0 6vw 5vh}
  .covbox{margin-top:0;gap:22px}
  #cover h1{font-size:clamp(38px,9vw,84px)}
}
</style>
</head>
<body data-screen="cover" data-tone="dark">

<div id="bgs"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div></div>

<div id="top">
  <a id="home" href="index.html" title="Back">&#8962;</a>
  <div id="tabs"></div>
  <button id="gear">&#9881;</button>
</div>

<div id="panel">
  <div class="row"><span>Sounds</span><input id="vol" type="range" min="0" max="100" value="70"></div>
  <div class="row"><span>Ambience</span><input id="vamb" type="range" min="0" max="100" value="35"></div>
  <button id="skip">Skip this one</button>
  <button id="again">Start this board again</button>
  <button id="unlock">Unlock all</button>
  <button id="reset">Reset progress</button>
</div>

<div id="cover"><div class="covbox">
  <h1>The Lighthouse</h1>
  <button id="enter">Go inside</button>
  <form id="gate" autocomplete="off">
    <svg class="glock" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M5 7V5a3 3 0 1 1 6 0v2h.5A1.5 1.5 0 0 1 13 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 13.5v-5A1.5 1.5 0 0 1 4.5 7H5zm1.5 0h3V5a1.5 1.5 0 0 0-3 0v2z"/></svg>
    <input id="pass" type="text" aria-label="Password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button id="passgo" type="submit" aria-label="Go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </form>
</div></div>

<div id="stage"><div class="wrap">
  <div id="say"></div>
  <div id="board"></div>
  <div id="hint"></div>
  <button id="next">Next</button>
</div></div>

<script>
const ASSET_DIR='lighthouse_assets/', SOUND_DIR='lighthouse_assets/Sounds/';
const A=f=>ASSET_DIR+f;

/* un fond par tableau. Une liste = essais dans l'ordre : le premier qui existe gagne. */
const BG={
  cover:[{f:'bg_cover.jpg',tone:'cover'}],
  logbook:[{f:'bg_logbook.jpg',tone:'dark'}],
  storm:[{f:'bg_storm.jpg',tone:'dark'}],
  machine:[{f:'bg_machine.jpg',tone:'dark'}],
  supplies:[{f:'bg_supplies.jpg',tone:'dark'}],
  emergency:[{f:'bg_emergency.jpg',tone:'dark'}],
  shore:[{f:'bg_shore.jpg',tone:'dark'},{f:'bg_island.jpg',tone:'light'}],
  island:[{f:'bg_island.jpg',tone:'light'}]
};
const VEIL={
  dark:'linear-gradient(90deg,rgba(15,26,44,.15) 0%,rgba(15,26,44,.55) 30%,rgba(15,26,44,.78) 55%,rgba(15,26,44,.82) 100%)',
  cover:'linear-gradient(90deg,rgba(10,18,34,0) 0%,rgba(10,18,34,.05) 40%,rgba(10,18,34,.3) 100%)',
  light:'linear-gradient(90deg,rgba(15,26,44,0) 0%,rgba(15,26,44,.03) 45%,rgba(15,26,44,.1) 100%)'
};
const UITONE={dark:'dark',cover:'dark',light:'light'};

const ALLTOOLS=['screwdriver','spanner','hammer','cutters','saw','brush','tape','oilcan'];
const GAME={

 logbook:{ title:"The Logbook", kind:"fix", bg:"logbook", amb:"logbook",
  prompt:"One word in the entry is wrong. Click it.",
  items:[
   [["If","the","wind","will get","stronger,","I","will","close","the","windows."],3,["gets","got","getting"],"gets"],
   [["We","have","too","much","lamps","in","the","cupboard."],3,["many","few","little"],"many"],
   [["He","don't","check","the","light","every","night."],1,["doesn't","isn't","hasn't"],"doesn't"],
   [["Can","you","bring","a few","oil","for","the","lamp?"],3,["a little","many","much"],"a little"],
   [["I","don't","have","many","time","before","the","storm."],3,["much","few","a few"],"much"],
   [["If","she","stir","the","paint,","it","will","not","dry."],2,["stirs","stirred","stirring"],"stirs"],
   [["There","were","less","boxes","than","yesterday."],2,["fewer","little","much"],"fewer"],
   [["The","keeper","have","found","a","strange","key."],2,["has","is","was"],"has"],
   [["If","it","rains,","we","closed","the","big","door."],4,["will close","closing","closes"],"will close"],
   [["She","didn't","went","up","the","stairs","last","night."],2,["go","gone","going"],"go"]
  ]},

 storm:{ title:"The Storm", kind:"gap", bg:"storm", amb:"storm",
  prompt:"Long action or short action? Choose the right form.",
  items:[
   ["I was climbing the stairs when I ___ a strange noise.","heard",["heard","was hearing","hear"]],
   ["She ___ in the logbook when all the lights went out.","was writing",["was writing","wrote","writes"]],
   ["While the wind ___, we closed every window in the tower.","was blowing",["was blowing","blew","blows"]],
   ["The radio ___ three times during the night.","rang",["rang","was ringing","rings"]],
   ["They were watching the sea when a small boat ___.","appeared",["appeared","was appearing","appears"]],
   ["He ___ supper when the alarm bell rang.","was cooking",["was cooking","cooked","cooks"]],
   ["What ___ you doing at midnight?","were",["were","did","was"]],
   ["The bell ___ while we were sleeping.","rang",["rang","was ringing","ring"]],
   ["I dropped the lamp while I ___ down the ladder.","was coming",["was coming","came","come"]],
   ["When the storm ___, everybody ran inside.","started",["started","was starting","starts"]]
  ]},

 machine:{ title:"The Machine Room", kind:"match", bg:"machine", amb:"machine", pic:"fault_",
  prompt:"Match each problem to its cause.",
  left:"Problem", right:"Cause",
  rounds:[
   [["The big lamp is not moving.","The motor is broken.","lamp"],
    ["The radio is not working.","The battery is empty.","radio"],
    ["The light goes on and off.","A wire is loose.","bulb"],
    ["There is smoke everywhere.","Something is burning.","smoke"]],
   [["The door does not close.","The lock is broken.","door"],
    ["The window is very noisy.","The wind is too strong.","window"],
    ["The clock is not working.","It needs a new battery.","clock"],
    ["The floor is wet.","There is a hole in the roof.","floor"]]
  ]},

 tools:{ title:"The Tool Chest", kind:"pick", bg:"machine", amb:"tools",
  prompt:"Read the sentence. Click the right tool.",
  items:[
   ["Click the tool which turns screws.","screwdriver"],
   ["Click the tool that hits nails.","hammer"],
   ["Click the tool which cuts wood.","saw"],
   ["Click the tool that cuts wire.","cutters"],
   ["Click the tool that you use to paint a wall.","brush"],
   ["Click the tool which measures the table.","tape"],
   ["Click the tool which has oil in it.","oilcan"],
   ["Click the tool that turns bolts.","spanner"]
  ]},

 supplies:{ title:"The Supplies", kind:"gap", bg:"supplies", amb:"supplies", pic:"supply_",
  prompt:"Countable or uncountable? Choose the right word.",
  items:[
   ["There is only ___ oil left for two nights.","a little",["a little","a few","many"],"oil"],
   ["We don't have ___ candles in the box.","many",["many","much","a little"],"candles"],
   ["How ___ fuel is there in the can?","much",["much","many","few"],"fuel"],
   ["I found ___ matches in the bottom drawer.","a few",["a few","a little","much"],"matches"],
   ["There isn't ___ time before it gets dark.","much",["much","many","few"]],
   ["We have too ___ rope and not enough wire.","much",["much","many","few"],"rope"],
   ["There are ___ tins of soup on the top shelf.","a few",["a few","a little","much"],"tins"],
   ["How ___ blankets did you bring?","many",["many","much","little"],"blankets"],
   ["We have ___ bread, but no butter at all.","some",["some","many","a few"],"bread"],
   ["There were ___ birds on the rocks than last week.","fewer",["fewer","less","much"]]
  ]},

 orders:{ title:"Emergency", kind:"order", bg:"emergency", amb:"emergency",
  prompt:"Put the steps in the right order.",
  rounds:[
   ["The light has failed. What do you do?",
    ["Turn off the power.","Find the broken bulb.","Put in a new bulb.",
     "Turn the power back on.","Write the time in the logbook."]],
   ["A storm is coming. What do you do?",
    ["Close every window.","Tie down the small boat.","Fill the lamps with oil.",
     "Switch on the radio.","Wait inside the tower."]],
   ["You have found something on the beach. What do you do?",
    ["Look at it carefully.","Take a photograph of it.","Carry it up to the tower.",
     "Describe it in the logbook.","Call for help on the radio."]]
  ]},

 suspects:{ title:"The Suspects", kind:"deduce", bg:"shore", amb:"suspects",
  prompt:"Read their stories and the clue. Whose story is wrong?",

/* ------------------------------------------------------------ audio : bruitages d'action */
let AC=null,GAIN=null,vol=.7;
function actx(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  GAIN=AC.createGain();GAIN.gain.value=vol;GAIN.connect(AC.destination);}
function tone(f,d,t,v,to){ if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=t||'sine';o.frequency.value=f;
  if(to)o.frequency.exponentialRampToValueAtTime(to,AC.currentTime+d);
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(v||.22,AC.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(GAIN);o.start();o.stop(AC.currentTime+d+.02);}
const S={
  tap(){tone(560,.05,'sine',.12);},
  good(){tone(660,.1,'sine',.2);setTimeout(()=>tone(880,.15,'sine',.18),90);},
  nope(){tone(200,.12,'triangle',.14,155);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.24,'sine',.18),i*105));},
  chime(){[1047,1319,1568].forEach((f,i)=>setTimeout(()=>tone(f,1.6,'sine',.09),i*260));}
};

/* ------------------------------------------------------------ audio : ambiance (fichiers, jamais synthétisée) */
/* Pour chaque tableau : les fichiers essayés dans l'ordre, le premier qui existe gagne.
   Le jeu commence dehors dans la tempête (ambient_cover), se passe dedans (ambient_inside :
   la même tempête, étouffée par les murs) et finit dehors à l'aube (ambient_island).
   Le même fichier sur deux tableaux qui se suivent continue sans coupure. Pour donner son
   propre son à un tableau, il suffit de déposer ambient_<tableau>.mp3 dans
   lighthouse_assets/Sounds/ : il passe avant le son partagé. */
const AMBIENT={
  cover:['ambient_cover.mp3'],
  logbook:['ambient_logbook.mp3','ambient_inside.mp3'],
  storm:['ambient_storm.mp3','ambient_inside.mp3'],
  machine:['ambient_machine.mp3','ambient_inside.mp3'],
  tools:['ambient_tools.mp3','ambient_inside.mp3'],
  supplies:['ambient_supplies.mp3','ambient_inside.mp3'],
  emergency:['ambient_emergency.mp3','ambient_inside.mp3'],
  suspects:['ambient_suspects.mp3','ambient_island.mp3'],
  island:['ambient_island.mp3']

/* Deux lecteurs seulement, réutilisés pour tous les tableaux (fondu enchaîné de l'un à l'autre).
   Safari et les tablettes n'autorisent la lecture qu'aux éléments « déverrouillés » par un geste :
   on les déverrouille tous les deux au premier geste, puis on ne fait que changer leur source. */
const AMB={master:.35,want:null,ready:false,started:false,tok:0,slots:[],cur:null,files:{}};
const GRAPH=/^https?:$/.test(location.protocol);
function silentWav(){
  const n=800,b=new Uint8Array(44+n*2),d=new DataView(b.buffer);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};
  w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);
  d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,16000,true);d.setUint16(32,2,true);
  d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function ambApply(S){
  const v=Math.max(0,Math.min(1,S.level*AMB.master));
  if(S.g)S.g.gain.value=v;else S.el.volume=v;
}
function ambFade(S,to,ms,after){
  clearInterval(S.timer);
  const from=S.level,t0=performance.now();
  S.timer=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/ms);
    S.level=from+(to-from)*k;ambApply(S);
    if(k>=1){clearInterval(S.timer);if(after)after();}
  },40);
}
function ambStart(){
  if(AMB.started)return;AMB.started=true;
  actx();
  AMB.slots=[0,1].map(()=>{
    const el=new Audio();el.loop=true;el.preload='auto';
    const S={el:el,file:null,ok:false,level:0,g:null,timer:0,abort:null};
    if(GRAPH&&AC){
      try{const src=AC.createMediaElementSource(el);S.g=AC.createGain();S.g.gain.value=0;src.connect(S.g);S.g.connect(AC.destination);}
      catch(e){S.g=null;}
    }
    return S;
  });
  const url=silentWav();
  Promise.all(AMB.slots.map(S=>{
    S.el.src=url;
    try{const p=S.el.play();return p&&p.then?p.then(()=>S.el.pause()).catch(()=>{}):Promise.resolve();}
    catch(e){return Promise.resolve();}
  })).then(()=>{
    AMB.slots.forEach(S=>{S.el.removeAttribute('src');});
    AMB.ready=true;
    if(AMB.want)ambient(AMB.want);
  });
}
/* charge un fichier dans un lecteur ; done(true) dès qu'il joue, done(false) s'il n'existe pas.
   Un appel répété pour le même fichier (un clic pendant le chargement) ne relance jamais le téléchargement. */
function ambLoad(S,file,done){
  const el=S.el;let fin=false;
  if(S.abort)S.abort();
  const have=(S.file===file&&!!el.getAttribute('src'));      /* ce lecteur a déjà ce fichier : joué, en pause ou en cours de chargement */
  if(have&&S.ok&&!el.paused){done(true);return;}              /* il joue (fondu de sortie en cours) : on le rattrape tel quel */
  const off=()=>{el.removeEventListener('playing',ok);el.removeEventListener('error',bad);};
  const ok=()=>{if(fin)return;fin=true;off();S.ok=true;done(true);};
  const bad=()=>{if(fin)return;fin=true;off();try{el.pause();}catch(e){}el.removeAttribute('src');try{el.load();}catch(e){}S.file=null;S.ok=false;done(false);};
  S.abort=()=>{if(fin)return;fin=true;off();};
  if(!have){clearInterval(S.timer);S.level=0;ambApply(S);S.ok=false;}
  S.file=file;
  el.addEventListener('playing',ok);el.addEventListener('error',bad);
  if(!have)el.src=SOUND_DIR+file;
  try{const p=el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
}
function ambSilence(){
  const old=AMB.cur;AMB.cur=null;
  if(old)ambFade(old,0,1000,()=>{if(AMB.cur!==old)old.el.pause();});
}
function ambCross(S){
  const old=AMB.cur;AMB.cur=S;
  ambFade(S,1,1000);
  if(old&&old!==S)ambFade(old,0,1000,()=>{if(AMB.cur!==old)old.el.pause();});
}
function ambTry(cand,i,tok){
  if(tok!==AMB.tok)return;
  const file=cand[i];
  if(!file){ambSilence();return;}
  const cur=AMB.cur;
  if(cur&&cur.file===file){if(cur.el.paused){try{cur.el.play();}catch(e){}}ambFade(cur,1,400);return;}
  const S=AMB.slots.find(x=>x!==cur&&x.file===file)||AMB.slots.filter(x=>x!==cur).sort((a,b)=>a.level-b.level)[0];
  ambLoad(S,file,good=>{
    if(tok!==AMB.tok)return;
    if(!good){AMB.files[file]='missing';ambTry(cand,i+1,tok);return;}
    AMB.files[file]='ok';ambCross(S);
  });
}
function ambient(board){
  AMB.want=board;
  if(!AMB.ready)return;
  const tok=++AMB.tok;
  ambTry((AMBIENT[board]||[]).filter(f=>AMB.files[f]!=='missing'),0,tok);
}
function onGesture(){
  actx();
  if(!AMB.started){ambStart();return;}
  if(!AMB.ready)return;
  const c=AMB.cur;
  if(c&&c.el.paused){try{c.el.play();}catch(e){}}          /* un navigateur avait refusé : on réessaie */
  else if(!c&&AMB.want)ambient(AMB.want);
}
['click','keydown'].forEach(ev=>document.addEventListener(ev,onGesture,{passive:true}));

/* ------------------------------------------------------------ fonds : fondu enchaîné d'une seconde */
const layers=[document.getElementById('bgA'),document.getElementById('bgB')];
let vis=-1,curBg='',bgTok=0;
const probed={};
function probe(f){
  if(!probed[f])probed[f]=new Promise(res=>{const i=new Image();i.onload=()=>res(true);i.onerror=()=>res(false);i.src=A(f);});
  return probed[f];
}
async function setBg(list){
  const tok=++bgTok;let hit=null;
  for(const x of list){if(await probe(x.f)){hit=x;break;}}
  if(tok!==bgTok||!hit)return;
  document.body.dataset.tone=UITONE[hit.tone];
  if(hit.f===curBg){layers[vis].style.setProperty('--veil',VEIL[hit.tone]);return;}
  const n=vis===0?1:0,L=layers[n];
  L.style.backgroundImage='url("'+A(hit.f)+'")';
  L.style.setProperty('--veil',VEIL[hit.tone]);
  L.classList.add('on');
  if(vis>=0)layers[vis].classList.remove('on');
  vis=n;curBg=hit.f;
}

/* ------------------------------------------------------------ progression (gardée dans le navigateur) */
const LS='lighthouse_progress_v1';
function loadProg(){
  try{
    const r=JSON.parse(localStorage.getItem(LS)||'null');
    if(r&&Array.isArray(r.done)){
      const done=r.done.filter(k=>ORDER.indexOf(k)>=0);
      let open=Math.max(1,Math.min(ORDER.length,r.open|0));
      ORDER.forEach((k,i)=>{if(done.indexOf(k)>=0&&open<i+2)open=Math.min(ORDER.length,i+2);});
      return {done:done,open:open};
    }
  }catch(e){}
  return {done:[],open:1};
}
let prog=loadProg();
function saveProg(){try{localStorage.setItem(LS,JSON.stringify(prog));}catch(e){}}
const isOpen=k=>ORDER.indexOf(k)<prog.open;
const isDone=k=>prog.done.indexOf(k)>=0;
function firstUnfinished(){
  for(const k of ORDER)if(!isDone(k))return isOpen(k)?k:ORDER[0];
  return ORDER[0];
}
function completeBoard(k){
  const i=ORDER.indexOf(k);let pop=null;
  if(!isDone(k))prog.done.push(k);
  if(i+1<ORDER.length&&prog.open<i+2){prog.open=i+2;pop=ORDER[i+1];}
  saveProg();tabs(pop);
}

/* ------------------------------------------------------------ le verrou d'entrée */
/* Un verrou contre une enfant curieuse, pas une sécurité : le code est public. Seule l'empreinte
   du mot de passe est écrite ici (majuscules et espaces autour ignorés). Trouvé une fois sur un
   appareil, il y reste ; changer PASS reverrouille tous les appareils. */
const PASS='20vlfw9tq7h',PKEY='lighthouse_pass_v1';
let passOK=false;
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);
  b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return (4294967296*(2097151&b)+(a>>>0)).toString(36);}
function passKnown(){if(passOK)return true;try{return localStorage.getItem(PKEY)===PASS;}catch(e){return false;}}
function tryEnter(){
  if(passKnown()){enter();return;}
  document.body.classList.add('gate');
  const p=$('pass');p.value='';try{p.focus();}catch(e){}
}
/* points au lieu des lettres : Sophia voit l'écran partagé */
if(!(window.CSS&&CSS.supports&&CSS.supports('-webkit-text-security','disc')))$('pass').type='password';

function done(msg,last,keep){

    x.onclick=()=>{actx();
      if(st===steps[want]){
        S.good();const s=$('slot'+want);
        s.lastChild.textContent=st;s.classList.add('filled');
        x.classList.add('done');want++;
        if(want>=steps.length)setTimeout(()=>done('That is the right order.',round>=t.rounds.length-1),650);
      }else{S.nope();x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);}
    };
    pool.appendChild(x);
  });
  b.appendChild(pool);
}

/* ------------------------------------------------------- désigner */
function drawPick(t){
  if(idx>=t.items.length)idx=0;
  const [sen,ans]=t.items[idx];
  $('say').innerHTML=t.prompt+'<small>'+(idx+1)+' / '+t.items.length+'</small>';
  const b=$('board');b.innerHTML='';
  b.appendChild(el('div','sentence',sen));
  const ids=shuffle([ans].concat(shuffle(ALLTOOLS.filter(x=>x!==ans)).slice(0,3)));
  const g=el('div','picks');
  ids.forEach(id=>{
    const c=el('button','pcard');c.dataset.id=id;
    const im=el('img');im.decoding='async';im.src=A('tool_'+id+'.jpg');im.alt='';c.appendChild(im);
    c.onclick=()=>{actx();
      if(id===ans){S.good();c.classList.add('good');
        g.querySelectorAll('.pcard').forEach(x=>{if(x!==c)x.classList.add('done');});
        setTimeout(()=>done('Yes.',idx>=t.items.length-1),650);}
      else{S.nope();c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),400);}
    };
    g.appendChild(c);
  });
  b.appendChild(g);
}

/* ------------------------------------------------------- déduire */
function drawDeduce(t){
  if(round>=t.rounds.length)round=0;
  const R=t.rounds[round];
  $('say').innerHTML=t.prompt+'<small>'+(round+1)+' / '+t.rounds.length+'</small>';
  const b=$('board');b.innerHTML='';
  b.appendChild(el('div','what',R.what));
  const row=el('div','suspects');
  const why=el('div','why');why.style.display='none';
  R.stories.forEach(([id,text])=>{
    const c=el('button','scard');c.dataset.id=id;
    const im=el('img');im.decoding='async';im.src=A('suspect_'+id+'.jpg');im.alt='';
    c.appendChild(im);c.appendChild(el('span',null,text));
    c.onclick=()=>{actx();
      if(id===R.ans){
        S.good();c.classList.add('good');
        row.querySelectorAll('.scard').forEach(x=>{if(x!==c)x.classList.add('dim');});
        why.innerHTML='<p>'+R.why+'</p><p class="tell">Why? Tell me.</p>';why.style.display='block';
        setTimeout(()=>done('',round>=t.rounds.length-1,true),700);
      }else{S.nope();c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),400);}
    };
    row.appendChild(c);
  });
  b.appendChild(row);
  b.appendChild(el('div','clue','<b>Clue</b>'+R.clue));
  b.appendChild(why);
}

/* ------------------------------------------------------------ events */
$('gear').onclick=e=>{e.stopPropagation();$('panel').classList.toggle('on');};
$('vol').oninput=e=>{vol=e.target.value/100;if(GAIN)GAIN.gain.value=vol;};
$('vamb').oninput=e=>{AMB.master=e.target.value/100;AMB.slots.forEach(ambApply);};
$('enter').onclick=()=>{actx();tryEnter();};
$('gate').onsubmit=e=>{
  e.preventDefault();actx();
  const p=$('pass'),g=$('gate');
  if(h53('lighthouse|'+p.value.trim().toLowerCase())===PASS){
    passOK=true;try{localStorage.setItem(PKEY,PASS);}catch(e){}
    p.blur();document.body.classList.remove('gate');S.good();enter();
  }else{
    S.nope();p.value='';g.classList.remove('bad');void g.offsetWidth;g.classList.add('bad');
  }
};
$('skip').onclick=()=>{
  actx();$('panel').classList.remove('on');
  if(!cur){tryEnter();return;}
  const t=GAME[cur];
  if(!lastOf(t)){if(multi(t))round++;else idx++;draw();return;}
  completeBoard(cur);
  if(cur===FINAL)ending();else nextBoard();
};
$('again').onclick=()=>{$('panel').classList.remove('on');if(cur)go(cur);};
$('unlock').onclick=()=>{prog.open=ORDER.length;saveProg();tabs();$('panel').classList.remove('on');};
$('reset').onclick=()=>{prog={done:[],open:1};saveProg();$('panel').classList.remove('on');goCover();};
document.addEventListener('click',e=>{
  if(!$('panel').contains(e.target)&&e.target!==$('gear'))$('panel').classList.remove('on');});

goCover();
</script>
</body>
