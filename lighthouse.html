<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Lighthouse</title>
<style>
:root{
  --night:#16233a; --deep:#0f1a2c; --panel:#1f3050; --line:#2f4570;
  --lamp:#f2c14e; --warm:#e8a33d; --pale:#e9edf5; --soft:#9fb0cb;
  --go:#4fb894; --bad:#d8705f;
  --bar:rgba(15,26,44,.92); --wrap:rgba(15,26,44,.72); --wrapline:rgba(242,193,78,.22);
  --card:rgba(255,255,255,.05); --hov:rgba(242,193,78,.12); --tabfg:#16233a;
  --shadow:rgba(0,0,0,.4); --tint:rgba(242,193,78,.12);
}
body[data-tone=light]{
  --panel:#fff8ec; --line:rgba(46,60,96,.34);
  --lamp:#9c5a0a; --pale:#25304b; --soft:#56627f;
  --go:#23855f; --bad:#bd4d3a;
  --bar:rgba(255,250,241,.84); --wrap:rgba(255,251,244,.8); --wrapline:rgba(156,90,10,.32);
  --card:rgba(255,255,255,.62); --hov:rgba(214,146,52,.2); --tabfg:#fff;
  --shadow:rgba(60,40,10,.22); --tint:rgba(214,146,52,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:#0f1a2c;color:var(--pale);
  font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* fonds : deux calques en fondu enchaîné d'une seconde, chacun avec son voile */
#bgs{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;background:#0f1a2c}
.bg{position:absolute;top:0;right:0;bottom:0;left:0;background:#0f1a2c left center/cover no-repeat;opacity:0;transition:opacity 1s ease,filter 2.4s ease}
.bg.on{opacity:1}
.bg::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:var(--veil);transition:opacity 1s ease}
body.dawn .bg::after{opacity:0;transition:opacity 4s ease}
body.dawn .bg.on{filter:brightness(1.05) saturate(1.06)}

#top,#home,#gear,.tab,.wrap,#say,#hint{transition:background-color 1s ease,color 1s ease,border-color 1s ease}
#top{
  position:fixed;top:0;left:0;right:0;height:62px;z-index:10;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--bar);border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
#home{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  text-decoration:none;color:var(--soft);flex:0 0 auto;
}
#tabs{display:flex;gap:7px;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  white-space:nowrap;font-size:14.5px;color:var(--soft);
}
.tab.on{background:var(--lamp);border-color:var(--lamp);color:var(--tabfg);font-weight:600}
.tab.locked{opacity:.4;cursor:default;pointer-events:none}
.tab .lock{width:12px;height:12px;margin-left:7px;vertical-align:-1px;fill:currentColor}
.tab.pop{animation:pop .7s}
#gear{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  color:var(--soft);flex:0 0 auto;font-size:16px}

/* le petit phare : la seule trace de progression, un faisceau qui grandit à chaque tableau fini */
#beacon{position:relative;width:26px;height:44px;flex:0 0 auto;color:var(--soft);z-index:1}
#beacon .tower{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
#beacon .lamp{fill:#f2c14e;stroke:none;opacity:var(--a,.2);transition:opacity 1.2s ease}
#beacon .beam{position:absolute;right:13px;top:12px;height:22px;margin-top:-11px;width:var(--len,10px);opacity:var(--a,.2);
  transform-origin:100% 50%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(to left,rgba(255,230,150,.95),rgba(255,214,120,.4) 55%,rgba(255,205,110,0));
  clip-path:polygon(100% 42%,0 0,0 100%,100% 58%);transition:width 1.4s ease,opacity 1.4s ease}
#beacon.full .beam{animation:sweep 4.2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
body[data-tone=light] #beacon .beam{mix-blend-mode:normal;
  background:linear-gradient(to left,rgba(214,140,40,.9),rgba(214,146,52,.35) 55%,rgba(214,146,52,0))}
body[data-screen=cover] #beacon{visibility:hidden}

#panel{
  position:fixed;top:66px;right:12px;z-index:20;display:none;width:250px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:13.5px;color:var(--soft);
  box-shadow:0 10px 30px var(--shadow);
}
#panel.on{display:block}
#panel .row{display:flex;align-items:center;gap:10px;margin:8px 0}
#panel .row span{flex:0 0 74px}
#panel input[type=range]{flex:1;accent-color:var(--lamp)}
#panel button{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);font-size:13.5px;color:var(--pale)}
#seanow{display:flex;align-items:center;gap:10px;margin:14px 0 2px;padding-top:12px;
  border-top:1px solid var(--line);color:var(--pale);font-weight:600;font-size:14.5px}
#seanow .wave{height:20px;width:auto}

#stage{position:fixed;z-index:1;top:62px;left:0;right:0;bottom:0;overflow-y:auto;padding:22px 16px 60px}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:1;background:var(--wrap);border:1px solid var(--wrapline);border-radius:18px;padding:26px 22px 30px;backdrop-filter:blur(3px);box-shadow:0 12px 40px var(--shadow)}
body.dawn .wrap{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}
#say{text-align:center;font-size:21px;font-size:clamp(17px,2.2vw,21px);color:var(--lamp);
  margin:0 0 22px;min-height:30px;font-weight:600}
#say small{display:block;font-size:13px;color:var(--soft);font-weight:400;margin-top:5px;letter-spacing:.04em}

.sentence{
  font-size:27px;font-size:clamp(19px,2.8vw,27px);line-height:1.9;text-align:center;
  margin:8px auto 26px;max-width:720px;
}
.tok{display:inline-block;padding:3px 7px;border-radius:8px;margin:0 1px}
.tok.click{border:1px dashed var(--line);cursor:pointer;transition:background .12s}
.tok.click:hover{background:var(--hov)}
.tok.gap{border:2px dashed var(--lamp);color:var(--lamp);min-width:96px;text-align:center}
.tok.fixed{border:2px solid var(--go);color:var(--go)}
.tok.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.onepic{display:flex;justify-content:center;margin:0 0 4px}
.onepic img{width:170px;width:min(170px,40vw);height:170px;height:min(170px,40vw);border-radius:14px;box-shadow:0 6px 20px var(--shadow)}
.opts{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:8px}
.opt{
  padding:13px 22px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:20px;font-size:clamp(16px,2vw,20px);
  transition:transform .1s,border-color .12s,background .12s;
}
.opt:hover{background:var(--hov)}
.opt:active{transform:scale(.96)}
.opt.bad{animation:shake .4s;border-color:var(--bad)}
.opt.good{animation:pop .4s;border-color:var(--go);color:var(--go)}
.opt.done{opacity:.25;pointer-events:none}

/* relier */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;max-width:760px;margin:0 auto}
.cell{
  display:block;width:100%;margin:0 0 10px;
  padding:13px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:17px;font-size:clamp(14.5px,1.8vw,17px);
  transition:transform .1s,border-color .12s,background .12s;text-align:left;
}
.cell:hover{background:var(--hov)}
.cell.sel{border-color:var(--lamp);background:var(--tint)}
.cell.done{opacity:.25;pointer-events:none;border-color:var(--go)}
.cell.bad{animation:shake .4s}
.cell.withpic{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px}
.cell.withpic.done{opacity:1;border-color:var(--go);box-shadow:0 0 0 1px var(--go)}
.pic{position:relative;width:78px;height:78px;border-radius:9px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 2px 8px var(--shadow);transition:box-shadow 1s ease}
.pic img{display:block;width:100%;height:100%;object-fit:cover;transition:filter 1s ease}
/* la panne : terne, et son défaut bouge ; réparée : les couleurs reviennent, le défaut s'arrête */
.pic img.fixedimg{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity .9s ease}
.fixed .pic img.fixedimg{opacity:1}
.broken .pic img{filter:grayscale(1) brightness(.8) contrast(.92)}
.fixed .pic{animation:mend .7s ease}
@keyframes mend{50%{transform:scale(1.1)}}
.f-bulb.broken .pic img{animation:blink 1.3s steps(1) infinite}
@keyframes blink{0%,100%{filter:grayscale(1) brightness(.72)}10%{filter:grayscale(.2) brightness(1.3)}16%{filter:grayscale(1) brightness(.68)}
  50%{filter:grayscale(.3) brightness(1.2)}56%{filter:grayscale(1) brightness(.72)}}
.f-bulb.fixed .pic{box-shadow:0 0 20px 7px rgba(255,205,100,.8)}
.f-bulb.fixed .pic img{filter:brightness(1.1) saturate(1.15)}
.f-smoke .pic::before,.f-smoke .pic::after{content:"";position:absolute;left:60%;top:30%;width:34%;height:34%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,70,72,.75),rgba(70,70,72,0) 70%);opacity:0;transition:opacity 1.2s ease}
.f-smoke.broken .pic::before{animation:puff 2.2s ease-out infinite}
.f-smoke.broken .pic::after{animation:puff 2.2s ease-out 1.1s infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(-12px,-44px) scale(2.3);opacity:0}}
.f-lamp .pic::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transform:translateX(-120%);
  background:linear-gradient(100deg,rgba(255,236,170,0) 30%,rgba(255,236,170,.85) 48%,rgba(255,236,170,0) 66%)}
.f-lamp.fixed .pic::after{opacity:1;animation:turn 1.7s linear infinite}
@keyframes turn{to{transform:translateX(120%)}}
.f-lamp.fixed .pic{box-shadow:0 0 18px 5px rgba(255,214,120,.7)}
.f-radio.broken .pic img{animation:crackle 2.4s infinite}
@keyframes crackle{0%,70%,100%{transform:none}74%{transform:translate(-2px,1px)}78%{transform:translate(2px,-1px)}82%{transform:translate(-1px,0)}}
.f-radio.fixed .pic img{animation:tune .45s ease-in-out infinite alternate}
@keyframes tune{to{transform:scale(1.05)}}
.f-door.broken .pic img{transform-origin:20% 50%;animation:swing 2.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:perspective(220px) rotateY(0)}50%{transform:perspective(220px) rotateY(-26deg)}}
.f-window.broken .pic img{animation:rattle .3s linear infinite}
@keyframes rattle{0%,100%{transform:none}25%{transform:translate(-1.5px,.5px)}75%{transform:translate(1.5px,-.5px)}}
.f-clock.broken .pic img{animation:stuck 3s infinite}
@keyframes stuck{0%,88%,100%{transform:none}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}
.f-clock.fixed .pic img{animation:tick 1s steps(1) infinite}
@keyframes tick{50%{transform:rotate(1.5deg)}}
.f-floor .pic::before{content:"";position:absolute;left:55%;top:-10px;width:8%;height:11%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:rgba(110,165,225,.95);opacity:0}
.f-floor.broken .pic::before{animation:drip 1.3s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{transform:translateY(60px);opacity:1}100%{transform:translateY(64px);opacity:0}}
.colhead{font-size:12.5px;letter-spacing:.1em;color:var(--soft);text-transform:uppercase;margin-bottom:4px}

/* remettre en ordre */
.slots{max-width:600px;margin:0 auto 18px}
.slot{
  border:2px dashed var(--line);border-radius:12px;padding:12px 15px;margin:8px 0;
  color:var(--soft);font-size:15px;min-height:50px;display:flex;align-items:center;gap:12px;
}
.slot.filled{border-style:solid;border-color:var(--go);color:var(--pale)}
.slot b{color:var(--lamp);flex:0 0 auto}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.step{
  padding:12px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:15.5px;max-width:300px;text-align:left;
}
.step:hover{background:var(--hov)}
.step.bad{animation:shake .4s;border-color:var(--bad)}
.step.done{display:none}

/* désigner : quatre cartes d'outils */
.picks{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:4px}
.pcard{padding:0;border-radius:16px;transition:opacity .2s}
.pcard img{display:block;width:150px;width:min(150px,38vw);height:150px;height:min(150px,38vw);border-radius:16px;
  box-shadow:0 6px 20px var(--shadow);transition:transform .12s}
.pcard:hover img{transform:translateY(-3px)}
.pcard.bad{animation:shake .4s}
.pcard.good{animation:pop .4s}
.pcard.good img{outline:3px solid var(--go);outline-offset:2px}
.pcard.done{opacity:.28;pointer-events:none}

/* déduire : quatre suspects, un indice */
.what{text-align:center;font-size:24px;font-size:clamp(18px,2.4vw,24px);font-weight:700;margin:0 0 16px}
.suspects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scard{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 10px 13px;
  border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;line-height:1.35;text-align:center;
  transition:transform .1s,border-color .12s,background .12s,opacity .2s;
}
.scard img{width:100%;max-width:150px;border-radius:12px;box-shadow:0 5px 16px var(--shadow)}
.scard:hover{background:var(--hov)}
.scard.bad{animation:shake .4s;border-color:var(--bad)}
.scard.good{animation:pop .4s;border-color:var(--go);border-width:2px}
.scard.dim{opacity:.4;pointer-events:none}
.scard .nm{display:none;font-size:15px;color:var(--lamp)}
.suspects.named .nm{display:block;animation:rise .5s ease both}
.clue{margin:16px 0 0;padding:12px 16px;border-radius:12px;border:1px solid var(--lamp);
  border-left-width:6px;background:var(--tint);font-size:18px;font-size:clamp(15px,1.9vw,18px)}
.clue b{display:block;color:var(--lamp);font-size:13px;letter-spacing:.06em;margin-bottom:2px}
.why{margin:16px 0 0;padding:14px 16px;border-radius:12px;border:1px solid var(--go);
  background:rgba(79,184,148,.14);font-size:18px;font-size:clamp(15px,1.9vw,18px);animation:rise .5s ease both}
.why p{margin:0}
.why .tell{margin-top:10px;font-style:italic;color:var(--soft)}
.suspects.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:720px){.suspects,.suspects.three{grid-template-columns:repeat(2,1fr)}}

@media (min-width:1000px){.wrap{margin:0 4vw 0 auto}}
#next{
  display:none;margin:30px auto 0;padding:14px 40px;border-radius:999px;
  background:var(--lamp);color:var(--tabfg);font-size:18px;font-weight:600;
}
#next.on{display:block}
#hint{text-align:center;color:var(--soft);font-size:14px;margin-top:20px;min-height:20px}

/* ------------------------------------------------------------ le monde réagit */
#fx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden}
#scene{position:absolute;left:0;top:0}
.fx{position:absolute}
.fxl{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.halo,.sun,.warmth,.flash,.soft,.dot,.lensglow,.alarmoff,.room{border-radius:50%;transform:translate(-50%,-50%)}
.halo{mix-blend-mode:screen;transition:width 1.6s ease,height 1.6s ease,opacity 1.6s ease;animation:flame 2.2s ease-in-out infinite;
  background:radial-gradient(circle,rgba(255,220,150,.9) 0%,rgba(255,176,80,.5) 30%,rgba(255,150,50,.14) 56%,rgba(255,140,40,0) 70%)}
@keyframes flame{0%,100%{filter:brightness(1)}25%{filter:brightness(1.2)}45%{filter:brightness(.88)}70%{filter:brightness(1.12)}85%{filter:brightness(.95)}}
.room{opacity:0;mix-blend-mode:soft-light;transition:opacity 1.8s ease;
  background:radial-gradient(circle,rgba(255,196,110,.95) 0%,rgba(255,176,90,.55) 32%,rgba(255,160,80,.18) 58%,rgba(255,150,70,0) 74%)}
.flash{opacity:0;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(235,230,255,.95) 0%,rgba(190,180,255,.45) 18%,rgba(150,140,240,.14) 42%,rgba(140,130,230,0) 62%)}
.soft{opacity:0;mix-blend-mode:screen;transition:opacity 2.6s ease;
  background:radial-gradient(circle,rgba(255,244,225,.6) 0%,rgba(230,215,255,.28) 40%,rgba(220,205,255,0) 70%)}
body.stormover .soft{opacity:1}
body.stormover .bg.on{filter:brightness(1.2) contrast(.9) saturate(.82)}
.spark{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#ffe3a0;
  box-shadow:0 0 10px 3px rgba(255,200,110,.85)}
.flyer{position:fixed;z-index:30;pointer-events:none;margin:0;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.dot{transition:transform .6s ease,opacity .6s ease;opacity:.5;
  background:radial-gradient(circle,rgba(255,236,200,.35) 0%,rgba(255,220,170,.1) 45%,rgba(255,210,150,0) 70%)}
.dot.lit{opacity:1;transform:translate(-50%,-50%) scale(1.3);mix-blend-mode:screen;
  background:radial-gradient(circle,#fffbe8 0%,#ffe29a 20%,rgba(255,196,90,.6) 42%,rgba(255,170,60,0) 68%)}
.lensglow{mix-blend-mode:screen;opacity:0;animation:light-in 2s ease forwards;
  background:radial-gradient(circle,rgba(255,244,200,.9) 0%,rgba(255,216,120,.5) 28%,rgba(255,200,100,.15) 52%,rgba(255,190,90,0) 68%)}
.alarmoff{opacity:0;animation:light-in 1s ease forwards;
  background:radial-gradient(circle,#40302c 0%,#352826 50%,rgba(52,40,38,0) 72%)}
@keyframes light-in{to{opacity:1}}
body.allclear .bg.on{filter:sepia(.55) saturate(.7) hue-rotate(-8deg) brightness(1.12)}
.sun{opacity:0;mix-blend-mode:screen;transition:top 3.2s ease,opacity 2.4s ease;
  background:radial-gradient(circle,rgba(255,253,240,1) 0%,rgba(255,240,190,.9) 16%,rgba(255,220,150,.45) 34%,rgba(255,205,130,0) 62%)}
.warmth{opacity:0;mix-blend-mode:soft-light;transition:opacity 2.6s ease;
  background:radial-gradient(circle,rgba(255,180,90,.95) 0%,rgba(255,170,95,.55) 30%,rgba(255,160,90,.2) 55%,rgba(255,150,90,0) 72%)}
.boat{opacity:0}
.gull{position:absolute;left:0;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(60,50,40,.18))}
.boat img{display:block;width:100%;height:100%;animation:rock 2.8s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(4%)}}
.shelf{position:absolute;left:3vw;bottom:12px;width:405px;height:190px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
@supports (aspect-ratio:1/1){.shelf{width:auto;height:190px;height:min(24vh,190px);aspect-ratio:814/382}}
.shelf>img{display:block;width:100%;height:100%}
.shelf .item{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.shelf .item img{height:100%;border-radius:14%;box-shadow:0 4px 10px rgba(0,0,0,.4);animation:land .45s ease}
.shelf .item.glow{background:radial-gradient(circle at 50% 70%,#fff6d6 0%,#ffd98a 18%,rgba(255,196,100,.35) 34%,rgba(255,190,90,0) 52%);animation:land .45s ease}
@keyframes land{0%{transform:translateY(-10px) scale(1.1)}60%{transform:translateY(2px) scale(.97)}100%{transform:none}}
.lost{display:flex;justify-content:center;align-items:center;height:96px;margin:-6px 0 8px}
.lost span{font-size:74px;line-height:1;filter:drop-shadow(0 0 16px rgba(255,220,140,.95));animation:bob 2.6s ease-in-out 1.2s infinite}
.lost img{height:92px;width:auto;filter:drop-shadow(0 0 14px rgba(255,220,140,.95));animation:bob 2.6s ease-in-out 1.2s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* le chat du phare (CAT.md) : en bas à gauche, il respire, il réagit, il ne parle jamais */
#cat{position:fixed;left:1.2vw;bottom:1vh;z-index:2;width:110px;height:170px;cursor:pointer;
  transform-origin:50% 100%;-webkit-tap-highlight-color:transparent;transition:bottom .35s ease,top .35s ease}
#cat .cb{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
#cat img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;opacity:0;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#cat[data-pose=hello] img[data-p=hello],#cat[data-pose=thinking] img[data-p=thinking],#cat[data-pose=cheer] img[data-p=cheer],
#cat[data-pose=surprised] img[data-p=surprised],#cat[data-pose=sleepy] img[data-p=sleepy]{opacity:1}
#cat.behind{z-index:0}
/* le nom du chat : demandé une fois, écrit en petit sous lui */
.catname{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;display:none;
  font-size:12.5px;line-height:1.25;padding:2px 9px;border-radius:999px;background:rgba(15,26,44,.72);color:#f3e6c4;pointer-events:none}
#cat.named .catname{display:block}
#cat.named{bottom:calc(1vh + 22px)}
#naming{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(10,16,30,.55);backdrop-filter:blur(3px)}
body.naming #naming{display:flex}
body.naming #cat{visibility:hidden}
#naming form{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%;padding:22px 24px 24px;border-radius:24px;
  background:rgba(15,26,44,.9);border:1px solid rgba(242,193,78,.45);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#naming img{height:180px;height:min(180px,26vh);width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#naming h2{margin:0;font-size:32px;font-size:clamp(24px,3.2vw,32px);color:#f2c14e;font-weight:700;text-align:center}
#naming .row{display:flex;gap:10px;align-items:center}
#catin{width:240px;width:min(52vw,240px);padding:12px 16px;border-radius:999px;border:1px solid rgba(233,237,245,.35);
  background:rgba(255,255,255,.08);color:#e9edf5;font:inherit;font-size:22px;text-align:center;outline:none}
#catin:focus{border-color:#f2c14e}
#catok{padding:12px 22px;border-radius:999px;background:#f2c14e;color:#16233a;font-size:20px;font-weight:700;flex:0 0 auto}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.024)}}
.shelf{left:calc(1.2vw + 128px)}
@supports (aspect-ratio:1/1){#cat{width:auto;height:170px;height:min(170px,22vh);aspect-ratio:153/237}.shelf{left:calc(1.2vw + min(170px,22vh) * .646 + 18px)}}

/* navigateurs sans « gap » dans les boîtes flexibles (classe posée au démarrage) : des marges à la place */
.nogap #top>*+*{margin-left:10px}.nogap #tabs>*+*{margin-left:7px}.nogap #panel .row>*+*{margin-left:10px}
.nogap #seanow>*+*{margin-left:10px}.nogap .opts>*,.nogap .pool>*,.nogap .picks>*{margin:5px}
.nogap .cell.withpic>*+*{margin-left:12px}.nogap .slot>*+*{margin-left:12px}.nogap .scard>*+*{margin-top:8px}
.nogap #naming form>*+*{margin-top:14px}.nogap #naming .row>*+*{margin-left:10px}.nogap .covbox>*+*{margin-top:30px}
.nogap #seas>*+*{margin-left:16px}.nogap .sea>*+*{margin-top:10px}.nogap #gate>*+*{margin-left:12px}
/* une image qui n'arrive pas : le mot à la place, pour qu'on puisse toujours jouer */
.tname{display:flex;align-items:center;justify-content:center;width:150px;height:150px;padding:8px;border-radius:16px;
  background:#fbf6ea;color:#25304b;font-size:20px;font-weight:700;text-align:center;box-shadow:0 6px 20px var(--shadow)}
.scard .tname{width:100%;max-width:150px;height:110px;font-size:17px}
#diag{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.4;color:var(--soft)}

/* l'île en mer calme : Sophia répond en regardant le paysage. Le plateau se fait petit et clair,
   et reste sur la mer, en bas à droite, loin du port, des bateaux, des oiseaux et du soleil. */
body[data-sea=calm][data-board=people]:not(.dawn) #stage{display:flex;flex-direction:column;padding-bottom:0}
body[data-sea=calm][data-board=people]:not(.dawn) .wrap{margin:auto 3vw 3vh auto;width:100%;max-width:430px;
  padding:16px 18px 18px;background:rgba(255,251,244,.5);backdrop-filter:blur(2px)}
body[data-sea=calm][data-board=people]:not(.dawn) #say{margin-bottom:10px}
body[data-sea=calm][data-board=people]:not(.dawn) .sentence{margin:4px auto 14px}
body[data-sea=calm][data-board=people]:not(.dawn) #next{margin-top:16px}
body[data-sea=calm][data-board=people]:not(.dawn) #hint{display:none}
@media (max-width:700px),(max-aspect-ratio:1/1){
  body[data-sea=calm][data-board=people]:not(.dawn) .wrap{margin:auto auto 2vh;max-width:520px}
}

/* téléphone : le décor en haut, le plateau en bas (à portée de pouce), plus léger et plus serré */
@media (max-width:600px){
  body{--wrap:rgba(15,26,44,.55)}
  body[data-tone=light]{--wrap:rgba(255,251,244,.6)}
  #stage{display:flex;flex-direction:column;padding:10px 8px 12px}
  body:not(.dawn) .wrap{margin:auto 0 0}
  .wrap{padding:16px 12px 16px;border-radius:16px;backdrop-filter:blur(2px)}
  #say{margin-bottom:14px;font-size:16px}
  #say small{font-size:12px}
  .sentence{margin:4px auto 16px;font-size:22px;font-size:clamp(18px,5.2vw,22px);line-height:1.8}
  .opts{gap:9px}
  .opt{padding:11px 16px}
  #next{margin-top:18px}
  #hint{margin-top:12px}
  .onepic img{width:110px;width:min(110px,30vw);height:110px;height:min(110px,30vw)}
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
  .cell{margin-bottom:8px;padding:10px;font-size:14px;word-wrap:break-word;overflow-wrap:anywhere}
  .cell.withpic{gap:8px;padding:6px 8px 6px 6px}
  .pic{width:50px;height:50px}
  .slots{margin-bottom:12px}
  .slot{min-height:40px;padding:8px 12px;margin:6px 0;font-size:14px}
  .step{padding:10px 13px;font-size:14px}
  .picks{gap:10px}
  .pcard img{width:118px;width:min(118px,27vw);height:118px;height:min(118px,27vw)}
  .what{font-size:17px;margin-bottom:12px}
  .suspects{gap:8px}
  .scard{padding:8px 6px 10px;font-size:13px;gap:6px}
  .scard img{max-width:92px}
  .clue,.why{margin-top:12px;padding:10px 12px;font-size:14.5px}
  .shelf{top:70px;bottom:auto;left:3vw;height:auto;width:94vw}
  #cat{height:84px;width:54px;left:6px}
  .lost{height:72px}
  .lost span{font-size:56px}
  .lost img{height:68px}
}

/* The Logbook : l'heure devant la phrase, et la page de son journal */
.sentence .hour{font-size:.55em;color:var(--lamp);letter-spacing:.06em;margin-right:.7em;vertical-align:.3em;font-weight:600;white-space:nowrap}
#journal{display:none;position:relative;z-index:1;max-width:560px;margin:16px auto 0;padding:12px 20px 14px;border-radius:6px;
  background-color:#fbf3dc;color:#3a2e1c;box-shadow:0 10px 28px rgba(0,0,0,.45);
  background-image:linear-gradient(rgba(156,90,10,.16) 1px,transparent 1px);background-size:100% 30px;background-position:0 11px;
  font-family:"Bradley Hand","Chalkboard SE","Segoe Print","Comic Sans MS",cursive}
body[data-board=logbook]:not(.dawn) #journal{display:block}
#journal .jl{display:flex;align-items:baseline;min-height:30px;line-height:30px;font-size:18px}
#journal .t{flex:0 0 auto;width:78px;font-size:13px;color:rgba(156,90,10,.4);letter-spacing:.03em;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
#journal .jl.on .t{color:#9c5a0a;font-weight:600}
#journal .w{opacity:0;transition:opacity 1s ease}
#journal .jl.on .w{opacity:1}
@media (min-width:1000px){#journal{margin:16px 4vw 0 auto}}
@media (max-width:600px){
  #journal{order:-1;margin:auto 0 8px 64px;padding:6px 12px 8px;max-width:none;background-size:100% 24px;background-position:0 7px}
  #journal .jl{min-height:24px;line-height:24px;font-size:14px}
  #journal .t{width:58px;font-size:11px}
  body[data-board=logbook]:not(.dawn) .wrap{margin-top:0}
}

/* la fin : calme, sans score */
.ending{text-align:center;padding:34px 8px 10px}
.ending p{margin:.12em 0;font-size:48px;font-size:clamp(26px,4.4vw,48px);font-weight:600;color:var(--pale);
  text-shadow:0 0 22px rgba(255,255,255,.75);animation:rise 2.6s ease both}
.ending p+p{animation-delay:1.1s}
.ending button{margin:34px auto 0;display:block;padding:12px 34px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:16px;animation:rise 2s ease 2.8s both}

/* l'écran d'ouverture */
#cover{position:fixed;top:0;right:0;bottom:0;left:0;z-index:3;display:none;align-items:center;justify-content:flex-end;padding:0 8vw}
.covbox{display:flex;flex-direction:column;align-items:center;gap:36px;margin-top:17vh;text-align:center}
#cover h1{margin:0;font-size:108px;font-size:clamp(38px,7.4vw,108px);line-height:1;font-weight:700;color:#f2c14e;
  text-shadow:0 0 34px rgba(242,193,78,.42),0 3px 12px rgba(6,12,26,.7)}
/* le choix de la mer : deux vagues, deux mots, aucun niveau ni chiffre */
#seas{display:flex;gap:18px;justify-content:center}
.sea{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;
  min-width:176px;padding:16px 26px 17px;border-radius:26px;font-size:26px;font-size:clamp(20px,2.3vw,26px);font-weight:700;
  transition:transform .12s}
.sea:hover{transform:scale(1.04)}
.sea:active{transform:scale(.98)}
.wave{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sea.calm{background:#f2c14e;color:#16233a;box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 30px rgba(242,193,78,.45)}
.sea.stormy{background:rgba(15,26,44,.62);color:#f2c14e;border:2px solid rgba(242,193,78,.72);
  box-shadow:0 8px 28px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.sea.calm .wave{width:56px;height:24px}
.sea.stormy .wave{width:62px;height:50px}
body[data-screen=cover] #cover{display:flex}
body[data-screen=cover] #stage{display:none}
body[data-screen=cover] #tabs{visibility:hidden}
body[data-screen=cover] #top{background:transparent;border-bottom-color:transparent;backdrop-filter:none}
body[data-screen=cover] #home,body[data-screen=cover] #gear{background:rgba(15,26,44,.55);color:#e9edf5;border-color:rgba(233,237,245,.35)}
/* le verrou d'entrée : un cadenas, un champ, une flèche — aucun mot */
#gate{display:none;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:999px;
  background:rgba(15,26,44,.72);border:1px solid rgba(242,193,78,.45);
  box-shadow:0 8px 28px rgba(0,0,0,.45);backdrop-filter:blur(4px)}
body.gate #seas{display:none}
body.gate #gate{display:flex;animation:rise .4s ease both}
body.gate #gate.bad{animation:shake .4s}
#gate .glock{width:26px;height:26px;fill:#f2c14e;flex:0 0 auto}
#pass{width:230px;width:min(46vw,230px);padding:12px 16px;border-radius:999px;border:1px solid rgba(233,237,245,.35);
  background:rgba(255,255,255,.08);color:#e9edf5;font:inherit;font-size:22px;letter-spacing:.18em;
  outline:none;-webkit-text-security:disc}
#pass:focus{border-color:#f2c14e}
#passgo{width:54px;height:54px;border-radius:50%;background:#f2c14e;color:#16233a;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(242,193,78,.38)}
#passgo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px),(max-aspect-ratio:1/1){
  #cover{justify-content:center;align-items:flex-end;padding:0 6vw 5vh}
  .covbox{margin-top:0;gap:22px}
  #cover h1{font-size:84px;font-size:clamp(38px,9vw,84px)}
  #seas{width:100%;max-width:440px;gap:12px}
  .sea{min-width:0;flex:1 1 0;padding:14px 10px 15px}
}
</style>

function bagDraw(s,h){
  const list=LOGPOOL[s][h],n=list.length;let all=null;
  try{all=JSON.parse(localStorage.getItem(BAGKEY)||'null');}catch(e){return list[Math.random()*n|0];}
  if(!all||typeof all!=='object')all={};
  let b=all[s+'|'+h];
  if(!b||!Array.isArray(b.left)||b.left.some(i=>typeof i!=='number'||i<0||i>=n))b={left:[],last:-1};
  if(!b.left.length){
    b.left=shuffle(list.map((_,i)=>i));
    if(b.left[0]===b.last&&n>1){const j=1+(Math.random()*(n-1)|0),x=b.left[0];b.left[0]=b.left[j];b.left[j]=x;}
  }
  const i=b.left.shift();b.last=i;all[s+'|'+h]=b;
  try{localStorage.setItem(BAGKEY,JSON.stringify(all));}catch(e){}
  return list[i];
}
const logbookGame=s=>HOURS.map(h=>{const e=bagDraw(s,h);return [e.tokens,e.wrong,e.options,e.answer,h];});

/* cinq exercices par partie, tirés au hasard ; une seule manche là où il y en a plusieurs */
const PER=5;

function deal(k){
  const t=Object.assign({},B(k));
  if(k==='logbook'){t.items=logbookGame(sea);return t;}
  if(t.rounds)t.rounds=[t.rounds[Math.random()*t.rounds.length|0]];
  else t.items=shuffle(t.items).slice(0,PER);
  return t;
}

/* ------------------------------------------------------------ audio : ambiance (fichiers, jamais synthétisée) */
/* Pour chaque tableau : les fichiers essayés dans l'ordre, le premier qui existe gagne.
   Le jeu commence dehors dans la tempête (ambient_cover), se passe dedans (ambient_inside :
   la même tempête, étouffée par les murs) et finit dehors à l'aube (ambient_island).
   Le même fichier sur deux tableaux qui se suivent continue sans coupure. Pour donner son
   propre son à un tableau, il suffit de déposer ambient_<tableau>.mp3 dans
   lighthouse_assets/Sounds/ : il passe avant le son partagé. */
const AMBIENT={
  cover:['ambient_cover.mp3'],
  logbook:['ambient_logbook.mp3','ambient_inside.mp3'],
  storm:['ambient_storm.mp3','ambient_inside.mp3'],
  machine:['ambient_machine.mp3','ambient_inside.mp3'],
  tools:['ambient_tools.mp3','ambient_inside.mp3'],
  supplies:['ambient_supplies.mp3','ambient_inside.mp3'],
  emergency:['ambient_emergency.mp3','ambient_inside.mp3'],
  suspects:['ambient_suspects.mp3','ambient_island.mp3'],
  island:['ambient_island.mp3']
};
/* Deux lecteurs seulement, réutilisés pour tous les tableaux (fondu enchaîné de l'un à l'autre).
   Safari et les tablettes n'autorisent la lecture qu'aux éléments « déverrouillés » par un geste :
   on les déverrouille tous les deux au premier geste, puis on ne fait que changer leur source. */
const AMB={master:.35,want:null,ready:false,started:false,tok:0,slots:[],cur:null,files:{}};
const GRAPH=/^https?:$/.test(location.protocol);
/* En ligne, l'ambiance est décodée en mémoire et bouclée à l'échantillon près par Web Audio : un
   lecteur <audio> laisse un petit trou à chaque tour (la reprise, plus les silences que l'encodeur
   MP3 met au début et à la fin du fichier). En fichier local (double-clic), le navigateur interdit
   ce chargement : on garde alors le lecteur <audio>. */
const LOOPLEN={'ambient_cover.mp3':60,'ambient_inside.mp3':60,'ambient_island.mp3':52.6507,   /* durées exactes des boucles */
  'layer_logbook.mp3':30,'layer_storm.mp3':60,'layer_machine.mp3':12.8761,'layer_tools.mp3':40,'layer_emergency.mp3':27};
const BUF={};                                /* fichier -> {b,a,e} décodé, une promesse pendant le chargement, ou 'missing' */
function decodeWith(c,ab){return new Promise((ok,ko)=>{try{const p=c.decodeAudioData(ab,ok,ko);if(p&&p.catch)p.catch(ko);}catch(e){ko(e);}});}
function decodeMp3(ab){
  let off=null;try{const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(O)off=new O(2,24000,24000);}catch(e){}
  const copy=ab.slice(0);                    /* decodeAudioData vide le tampon : une copie pour le second essai */
  return (off?decodeWith(off,ab):Promise.reject()).catch(()=>decodeWith(AC,copy));
}
/* début et fin exacts de la boucle. Les fichiers portent, juste après la boucle, une copie de son
   propre début : le vrai départ est l'endroit où le début et cette copie se superposent (les
   navigateurs ne retirent pas tous le silence que l'encodeur met en tête). Faute de copie, on saute
   simplement ce silence. */
function loopPoints(b,file){
  const r=b.sampleRate,ch=[];for(let c=0;c<b.numberOfChannels;c++)ch.push(b.getChannelData(c));
  const loud=i=>ch.some(x=>Math.abs(x[i])>.002),L=LOOPLEN[file],x0=ch[0];
  let a=-1,e=b.length;
  if(L){const N=Math.round(L*r),m=Math.round(r*.02),top=Math.min(3000,b.length-N-m);let best=-1;
    for(let k=0;k<=top;k++){let s=0,u2=0,v2=0;
      for(let i=0;i<m;i+=2){const u=x0[k+i],v=x0[k+N+i];s+=u*v;u2+=u*u;v2+=v*v;}
      const c=s/Math.sqrt(u2*v2+1e-12);if(c>best){best=c;a=k;}}
    if(best<.6)a=-1;else e=a+N;}
  if(a<0){a=0;const head=Math.min(b.length,r*.3|0);while(a<head&&!loud(a))a++;if(a>=head)a=0;
    if(L&&a+L*r<=b.length+2)e=Math.min(b.length,Math.round(a+L*r));
    else{let z=b.length-1;const tail=Math.max(a,b.length-(r*.3|0));while(z>tail&&!loud(z))z--;e=z+1;}}
  /* la copie qui suit la boucle sert à fondre la reprise sur 10 ms : la fin enchaîne sans marche */
  const n=Math.round(r*.01);
  if(e+n<=b.length&&a+n<e)for(const x of ch)for(let i=0;i<n;i++){const t=(i+.5)/n;x[a+i]=x[e+i]*(1-t)+x[a+i]*t;}
  return {a:a/r,e:e/r};
}
function bufGet(file){
  if(!BUF[file])BUF[file]=fetch(SOUND_DIR+file).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(decodeMp3)
    .then(b=>{const p=loopPoints(b,file);return BUF[file]={b:b,a:p.a,e:p.e};}).catch(()=>BUF[file]='missing');
  return Promise.resolve(BUF[file]);

function bufStart(S,at){
  const x=BUF[S.file],len=x.e-x.a,s=AC.createBufferSource();
  s.buffer=x.b;s.loop=true;s.loopStart=x.a;s.loopEnd=x.e;s.connect(S.g);
  const off=((at||0)%len+len)%len;s.start(0,x.a+off);S.src=s;S.t0=AC.currentTime-off;S.len=len;
}
function bufStop(S){
  if(!S.src)return;S.pos=((AC.currentTime-S.t0)%S.len+S.len)%S.len;
  try{S.src.stop();}catch(e){}try{S.src.disconnect();}catch(e){}S.src=null;
}
const playing=S=>AMB.buf?!!S.src:!S.el.paused;
function stopSlot(S){if(AMB.buf)bufStop(S);else S.el.pause();}
function resumeSlot(S){
  if(AMB.buf){if(!S.src&&S.file&&BUF[S.file]&&BUF[S.file].b)bufStart(S,S.pos);}
  else{try{const p=S.el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
}
/* comme ambLoad, pour la lecture en mémoire */
function ambLoadBuf(S,file,done){
  let fin=false;if(S.abort)S.abort();
  if(S.file===file&&S.src){done(true);return;}           /* il joue encore (fondu de sortie) : on le rattrape tel quel */
  S.abort=()=>{fin=true;};
  bufGet(file).then(x=>{
    if(fin)return;fin=true;
    if(x==='missing'){done(false);return;}
    const same=S.file===file;bufStop(S);clearInterval(S.timer);S.level=0;ambApply(S);
    S.file=file;bufStart(S,same?S.pos:0);S.ok=true;done(true);
  });
}
function silentWav(){
  const n=800,b=new Uint8Array(44+n*2),d=new DataView(b.buffer);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};
  w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);
  d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,16000,true);d.setUint16(32,2,true);
  d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);

function ambApply(S){
  const v=Math.max(0,Math.min(1,S.level*AMB.master));

function ambFade(S,to,ms,after){
  clearInterval(S.timer);
  const from=S.level,t0=performance.now();
  S.timer=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/ms);
    S.level=from+(to-from)*k;ambApply(S);
    if(k>=1){clearInterval(S.timer);if(after)after();}
  },40);
}
function ambStart(){
  if(AMB.started)return;AMB.started=true;
  actx();
  AMB.buf=GRAPH&&!!AC&&!!window.fetch;
  if(AMB.buf){
    AMB.slots=[0,1].map(()=>{const g=AC.createGain();g.gain.value=0;g.connect(AC.destination);
      return {g:g,src:null,file:null,ok:false,level:0,timer:0,abort:null,pos:0};});
    AMB.ready=true;if(AMB.want)ambient(AMB.want);if(LAY.want)layer(LAY.want);return;
  }
  AMB.slots=[0,1].map(()=>{
    const el=new Audio();el.loop=true;el.preload='auto';
    const S={el:el,file:null,ok:false,level:0,g:null,timer:0,abort:null};
    if(GRAPH&&AC){
      try{const src=AC.createMediaElementSource(el);S.g=AC.createGain();S.g.gain.value=0;src.connect(S.g);S.g.connect(AC.destination);}
      catch(e){S.g=null;}
    }
    return S;
  });
  const url=silentWav();
  Promise.all(AMB.slots.map(S=>{
    S.el.src=url;
    try{const p=S.el.play();return p&&p.then?p.then(()=>S.el.pause()).catch(()=>{}):Promise.resolve();}
    catch(e){return Promise.resolve();}
  })).then(()=>{
    AMB.slots.forEach(S=>{S.el.removeAttribute('src');});
    AMB.ready=true;
    if(AMB.want)ambient(AMB.want);
  });

/* charge un fichier dans un lecteur ; done(true) dès qu'il joue, done(false) s'il n'existe pas.
   Un appel répété pour le même fichier (un clic pendant le chargement) ne relance jamais le téléchargement. */
function ambLoad(S,file,done){
  const el=S.el;let fin=false;
  if(S.abort)S.abort();
  const have=(S.file===file&&!!el.getAttribute('src'));      /* ce lecteur a déjà ce fichier : joué, en pause ou en cours de chargement */
  if(have&&S.ok&&!el.paused){done(true);return;}              /* il joue (fondu de sortie en cours) : on le rattrape tel quel */
  const off=()=>{el.removeEventListener('playing',ok);el.removeEventListener('error',bad);};
  const ok=()=>{if(fin)return;fin=true;off();S.ok=true;done(true);};
  const bad=()=>{if(fin)return;fin=true;off();try{el.pause();}catch(e){}el.removeAttribute('src');try{el.load();}catch(e){}S.file=null;S.ok=false;done(false);};
  S.abort=()=>{if(fin)return;fin=true;off();};
  if(!have){clearInterval(S.timer);S.level=0;ambApply(S);S.ok=false;}
  S.file=file;
  el.addEventListener('playing',ok);el.addEventListener('error',bad);
  if(!have)el.src=SOUND_DIR+file;
  try{const p=el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
}
function ambSilence(){
  const old=AMB.cur;AMB.cur=null;
  if(old)ambFade(old,0,1000,()=>{if(AMB.cur!==old)stopSlot(old);});
}
function ambCross(S){
  const old=AMB.cur;AMB.cur=S;
  ambFade(S,1,1000);
  if(old&&old!==S)ambFade(old,0,1000,()=>{if(AMB.cur!==old)stopSlot(old);});
}
function ambTry(cand,i,tok){
  if(tok!==AMB.tok)return;
  const file=cand[i];
  if(!file){ambSilence();return;}
  const cur=AMB.cur;
  if(cur&&cur.file===file){if(!playing(cur))resumeSlot(cur);ambFade(cur,1,400);return;}
  const S=AMB.slots.find(x=>x!==cur&&x.file===file)||AMB.slots.filter(x=>x!==cur).sort((a,b)=>a.level-b.level)[0];
  (AMB.buf?ambLoadBuf:ambLoad)(S,file,good=>{
    if(tok!==AMB.tok)return;
    if(!good){AMB.files[file]='missing';ambTry(cand,i+1,tok);return;}
    AMB.files[file]='ok';ambCross(S);
  });

function ambient(board){
  AMB.want=board;
  if(!AMB.ready)return;
  const tok=++AMB.tok;
  ambTry((AMBIENT[board]||[]).filter(f=>AMB.files[f]!=='missing'),0,tok);

/* ------------------------------------------------------------ la couleur de chaque pièce */
/* Sous la tempête étouffée qui court dans tout le phare, chaque pièce ajoute sa couche : le feu du
   journal, le tonnerre, le ronron des machines, l'atelier, le vent en haut de la tour. En ligne
   seulement (lecture en mémoire) ; un fichier absent ne donne rien. */
const LAYER={logbook:'layer_logbook.mp3',storm:'layer_storm.mp3',machine:'layer_machine.mp3',
  tools:'layer_tools.mp3',orders:'layer_emergency.mp3'};
const LAY={want:null,cur:null,tok:0,gain:1};
const layLevel=()=>Math.max(0,Math.min(1,AMB.master*LAY.gain));
function layRamp(v,to,sec,stop){
  const t=AC.currentTime,g=v.g.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(to,t+sec);
  if(stop)setTimeout(()=>{try{v.s.stop();}catch(e){}try{v.s.disconnect();v.g.disconnect();}catch(e){}
    if(LAYER[LAY.want]!==v.file)delete BUF[v.file];},sec*1000+120);   /* la mémoire ne garde que la couche en cours */
}
function layer(board){
  LAY.want=board;
  if(!AMB.ready||!AMB.buf)return;
  const tok=++LAY.tok,file=board?LAYER[board]:null;LAY.gain=1;
  if(LAY.cur&&LAY.cur.file===file){layRamp(LAY.cur,layLevel(),1.2);return;}
  if(LAY.cur){layRamp(LAY.cur,0,1.2,true);LAY.cur=null;}
  if(!file)return;
  bufGet(file).then(x=>{
    if(tok!==LAY.tok||x==='missing')return;
    const g=AC.createGain(),src=AC.createBufferSource();g.gain.value=0;g.connect(AC.destination);
    src.buffer=x.b;src.loop=true;src.loopStart=x.a;src.loopEnd=x.e;src.connect(g);src.start(0,x.a);
    LAY.cur={file:file,g:g,s:src};layRamp(LAY.cur,layLevel(),1.6);
  });
}
/* plus fort ou plus doux, sans changer de pièce (le tonnerre qui s'éloigne) */
function layerTo(v,sec){LAY.gain=v;if(LAY.cur)layRamp(LAY.cur,layLevel(),sec||1.2);}
const layerIs=board=>!!(LAY.cur&&LAY.cur.file===LAYER[board]);

function onGesture(){
  actx();
  if(!AMB.started){ambStart();return;}
  if(!AMB.ready)return;
  const c=AMB.cur;
  if(c&&!playing(c))resumeSlot(c);                          /* un navigateur avait refusé : on réessaie */
  else if(!c&&AMB.want)ambient(AMB.want);
}
['click','keydown'].forEach(ev=>document.addEventListener(ev,onGesture,{passive:true}));

/* ------------------------------------------------------------ fonds : fondu enchaîné d'une seconde */
const layers=[document.getElementById('bgA'),document.getElementById('bgB')];
let vis=-1,curBg='',bgTok=0;

const IMGSTAT={ok:{},ko:{}};                 /* les images venues du réseau : arrivées, ou en échec */
function imgStat(url,ok){
  if(!url||url.indexOf('data:')===0)return;
  if(ok){IMGSTAT.ok[url]=1;delete IMGSTAT.ko[url];}else if(!IMGSTAT.ok[url])IMGSTAT.ko[url]=1;
  diag();
}
function loadImg(src,ms){return new Promise(res=>{
  const i=new Image();let end=false,t=0;
  const fin=v=>{if(end)return;end=true;clearTimeout(t);i.onload=i.onerror=null;res(v);};
  t=setTimeout(()=>fin(false),ms);i.onload=()=>fin(true);i.onerror=()=>fin(false);i.src=src;});}
const FULL={};
function getFull(f,last){
  if(!FULL[f])FULL[f]=loadImg(A(f),8000)
    .then(ok=>ok?A(f):last?loadImg(A(f)+'?r=1',8000).then(ok2=>ok2?A(f)+'?r=1':false):false)
    .then(u=>{if(last||u)imgStat(A(f),!!u);return u;});
  return FULL[f];
}
function paintBg(L,f,u){L.style.backgroundImage=[u?'url("'+u+'")':'',TINY[f]?'url("'+TINY[f]+'")':''].filter(Boolean).join(',')||'none';}
function showBg(x,u){
  document.body.dataset.tone=UITONE[x.tone];sceneFit(x.f);
  if(x.f===curBg&&vis>=0){const L=layers[vis];L.style.setProperty('--veil',VEIL[x.tone]);if(u)paintBg(L,x.f,u);return;}
  const n=vis===0?1:0,L=layers[n];
  paintBg(L,x.f,u);L.style.setProperty('--veil',VEIL[x.tone]);
  L.classList.add('on');
  if(vis>=0)layers[vis].classList.remove('on');
  vis=n;curBg=x.f;
}
async function setBg(list){
  const tok=++bgTok;
  showBg(list.find(x=>TINY[x.f])||list[list.length-1],false);     /* tout de suite, le flou */
  for(let i=0;i<list.length;i++){
    const u=await getFull(list[i].f,i===list.length-1);            /* les premiers choix sont facultatifs */
    if(tok!==bgTok)return;
    if(u){showBg(list[i],u);return;}
  }
}

/* ------------------------------------------------------------ le monde réagit */
/* Chaque bonne réponse change quelque chose dans la scène, tout de suite, avec un son : de la
   lumière, du mouvement, de la transparence, des particules, sur les images existantes. Les
   positions sont en pixels de l'image de fond et suivent son cadrage (cover, calé à gauche). */
const BGSIZE={'bg_cover.jpg':[1000,518],'bg_logbook.jpg':[1000,523],'bg_storm.jpg':[1000,524],'bg_machine.jpg':[1000,525],
  'bg_supplies.jpg':[1000,526],'bg_emergency.jpg':[1000,522],'bg_island.jpg':[1000,520],'bg_shore.jpg':[1000,520]};
const fxRoot=document.getElementById('fx'),scene=document.getElementById('scene');
let sceneWH=[1000,520],FXB=null,fxTimers=[],fxLoops=[],fxRun=0,fxSized=[];
function sceneFit(f){
  if(f&&BGSIZE[f])sceneWH=BGSIZE[f];
  const [w,h]=sceneWH,W=innerWidth,H=innerHeight,k=Math.max(W/w,H/h);
  Object.assign(scene.style,{width:w*k+'px',height:h*k+'px',top:(H-h*k)/2+'px'});
  fxSized.forEach(f=>f());
}
addEventListener('resize',()=>sceneFit());
function toScreen(x,y){const [w,h]=sceneWH,W=innerWidth,H=innerHeight,k=Math.max(W/w,H/h);return {x:x*k,y:(H-h*k)/2+y*k,k:k};}
function fxEl(cls,x,y,w,h){
  const e=document.createElement('div'),[iw,ih]=sceneWH;e.className='fx '+cls;
  e.style.left=x/iw*100+'%';e.style.top=y/ih*100+'%';
  if(w){e.style.width=w/iw*100+'%';e.style.height=(h||w)/ih*100+'%';}
  scene.appendChild(e);return e;
}
function fxSize(e,w){const [iw,ih]=sceneWH;e.style.width=w/iw*100+'%';e.style.height=w/ih*100+'%';}
function fxLater(f,ms){const id=setTimeout(f,ms);fxTimers.push(id);return id;}
function fxLoop(f){fxLoops.push(f);if(!fxRun)fxRun=requestAnimationFrame(fxFrame);}
function fxFrame(t){fxRun=0;fxLoops=fxLoops.filter(f=>f(t)!==false);if(fxLoops.length)fxRun=requestAnimationFrame(fxFrame);}
function fxCanvas(){
  const c=document.createElement('canvas'),g=c.getContext('2d');c.className='fxl';fxRoot.appendChild(c);
  const fit=()=>{const r=Math.min(2,devicePixelRatio||1);c.width=innerWidth*r;c.height=innerHeight*r;g.setTransform(r,0,0,r,0,0);};
  fit();fxSized.push(fit);return g;
}
function fxClear(){
  fxTimers.forEach(clearTimeout);fxTimers=[];fxLoops=[];if(fxRun){cancelAnimationFrame(fxRun);fxRun=0;}fxSized=[];
  scene.innerHTML='';[...fxRoot.children].forEach(c=>{if(c!==scene)c.remove();});
  document.querySelectorAll('.flyer').forEach(e=>e.remove());
  document.body.classList.remove('stormover','allclear');FXB=null;
}
function fxStart(k){try{fxClear();if(k&&FXBOARD[k]){FXB=Object.create(FXBOARD[k]);if(FXB.start)FXB.start();}}catch(e){}}
/* un effet qui échoue (vieux navigateur, image absente) ne doit jamais empêcher la suite du jeu */
function fxHit(a,b){let wow=false;try{wow=FXB&&FXB.hit?FXB.hit(a,b):false;}catch(e){}try{catGood(!!wow);}catch(e){}}
/* un objet qui s'envole d'un point de l'écran vers un autre, en arc */
function fly(from,x,y,o){
  o=o||{};const r=from.getBoundingClientRect(),c=from.cloneNode(true);
  c.className='flyer';c.removeAttribute('id');
  Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  document.body.appendChild(c);
  const dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),s=o.scale||.3,rot=o.spin||0,arc=o.arc===undefined?110:o.arc;
  const a=c.animate([
    {transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},
    {transform:'translate('+dx*.45+'px,'+(dy*.45-arc)+'px) scale('+(1+s)/2+') rotate('+rot/2+'deg)',opacity:1,offset:.5},
    {transform:'translate('+dx+'px,'+dy+'px) scale('+s+') rotate('+rot+'deg)',opacity:o.fade?0:1}],
    {duration:o.ms||1000,easing:'cubic-bezier(.45,.05,.35,1)',fill:'forwards'});
  a.onfinish=()=>{c.remove();if(o.done)o.done();};
}
function burst(x,y){
  for(let i=0;i<14;i++){
    const d=document.createElement('div');d.className='spark';d.style.left=x+'px';d.style.top=y+'px';fxRoot.appendChild(d);
    const a=Math.random()*Math.PI*2,r=30+Math.random()*60;
    d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+Math.sin(a)*r+'px) scale(.3)',opacity:0}],
      {duration:600+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'}).onfinish=()=>d.remove();
  }
}
/* la pluie, dehors seulement : elle tombe derrière la vitre du hublot, de moins en moins dense */
const PORT={x:201,y:236,rx:143,ry:163};                 /* la vitre du hublot, en pixels du fond de The Storm */
function rain(){
  const g=fxCanvas(),drops=[];let dens=1,want=1,E=null;
  const glass=()=>{const c=toScreen(PORT.x,PORT.y);E={x:c.x,y:c.y,rx:PORT.rx*c.k,ry:PORT.ry*c.k,k:c.k};};
  const add=top=>({x:E.x-E.rx-40+Math.random()*(E.rx*2+40),y:top?E.y-E.ry-Math.random()*20:E.y-E.ry+Math.random()*E.ry*2,
    v:(4.5+Math.random()*3.5)*E.k,l:(7+Math.random()*9)*E.k});
  glass();fxSized.push(()=>{glass();drops.forEach((d,i)=>Object.assign(d,add(false)));});
  for(let i=0;i<160;i++)drops.push(add(false));
  fxLoop(()=>{
    dens+=(want-dens)*.025;g.clearRect(0,0,innerWidth,innerHeight);
    const n=Math.round(drops.length*dens);if(n<1&&want===0)return false;
    g.save();g.beginPath();g.ellipse(E.x,E.y,E.rx,E.ry,0,0,Math.PI*2);g.clip();
    g.strokeStyle='rgba(214,220,255,.5)';g.lineWidth=Math.max(1,1.1*E.k);g.beginPath();
    for(let i=0;i<n;i++){const d=drops[i];d.y+=d.v;d.x+=d.v*.2;
      if(d.y-d.l>E.y+E.ry)Object.assign(d,add(true));
      g.moveTo(d.x,d.y);g.lineTo(d.x-d.l*.2,d.y-d.l);}
    g.stroke();g.restore();
  });
  return {set(v){want=Math.max(0,v);}};
}
/* des mouettes : gull_up, gull_mid, gull_down, gull_mid, en boucle, huit images par seconde */
const GULL=['up','mid','down','mid'].map(n=>A('gull_'+n+'.png'));
function flock(){
  let birds=[],iv=0;
  GULL.forEach(u=>{const i=new Image();i.src=u;});
  const tick=()=>{birds=birds.filter(b=>b.alive);for(const b of birds){b.f=(b.f+1)%4;b.el.src=GULL[b.f];}
    if(!birds.length){clearInterval(iv);iv=0;}};
  return {go(n,dir){
    const k=toScreen(0,0).k;
    for(let i=0;i<n;i++){
      const e=document.createElement('img'),w=(34+Math.random()*18)*k,b={el:e,f:Math.random()*4|0,alive:true};
      e.className='gull';e.alt='';e.src=GULL[b.f];e.style.width=w+'px';e.style.top=toScreen(0,60+Math.random()*120).y+'px';
      fxRoot.appendChild(e);birds.push(b);
      const x0=dir>0?-w-i*70-Math.random()*70:innerWidth+w+i*70+Math.random()*70,x1=dir>0?innerWidth+w:-2*w,
        dur=Math.abs(x1-x0)/((80+Math.random()*40)*k)*1000,f=dir>0?1:-1,up=(8+Math.random()*10)*k;
      e.animate([{transform:'translate('+x0+'px,0) scaleX('+f+')'},{transform:'translate('+(x0+x1)/2+'px,'+(-up)+'px) scaleX('+f+')'},
        {transform:'translate('+x1+'px,0) scaleX('+f+')'}],{duration:dur,easing:'linear',fill:'forwards'}).onfinish=()=>{b.alive=false;e.remove();};
    }
    if(!iv){iv=setInterval(tick,125);fxTimers.push(iv);}}};
}
/* le petit voilier (boat.png) sort du port et gagne le large */
function boat(){
  const e=fxEl('boat',290-17,352-20,34,41),im=document.createElement('img');im.src=A('boat.png');im.alt='';e.appendChild(im);
  return {go(){e.animate([{transform:'translate(0,0) scale(.95)',opacity:0},{transform:'translate(20%,12%) scale(.95)',opacity:1,offset:.12},
    {transform:'translate(620%,95%) scale(.9)',opacity:1}],{duration:9000,easing:'ease-in-out',fill:'forwards'});}};
}
function objFor(R){
  const id=R.obj||(/key/i.test(R.what)?'key':/cake/i.test(R.what)?'cake':/map/i.test(R.what)?'map':'');
  return {id:id,html:id?'<img alt="" src="'+A('found_'+id+'.png')+'">':'<span>✨</span>'};
}
const FXBOARD={
  /* un halo chaud autour de la lampe, qui grandit à chaque phrase corrigée */
  logbook:{
    start(){this.n=0;this.room=fxEl('room',160,190,1100);this.h=fxEl('halo',148,168,190);this.h.style.opacity=.45;},
    hit(){this.n++;const n=this.n,p=toScreen(148,150);
      fxSize(this.h,190+n*(innerWidth<600?28:60));this.h.style.opacity=Math.min(.9,.45+n*.09);
      this.h.animate([{transform:'translate(-50%,-50%) scale(1)',filter:'brightness(1)'},{transform:'translate(-50%,-50%) scale(1.45)',filter:'brightness(1.7)',offset:.25},
        {transform:'translate(-50%,-50%) scale(1)',filter:'brightness(1)'}],{duration:1500,easing:'ease-out'});
      this.room.style.opacity=Math.min(innerWidth<600?.3:.42,n*(innerWidth<600?.06:.085));burst(p.x,p.y);S.glow();}
  },
  /* la pluie s'éclaircit, les éclairs s'espacent ; à la dernière, la tempête cesse */
  storm:{
    start(){this.n=0;this.max=T.items.length;this.rain=rain();this.fl=fxEl('flash',228,185,1500);this.soft=fxEl('soft',200,235,520);this.strike(1600);},
    strike(ms){this.t=fxLater(()=>{
      if(this.n>=this.max)return;
      this.fl.animate([{opacity:0},{opacity:.9,offset:.07},{opacity:.12,offset:.2},{opacity:.7,offset:.32},{opacity:0}],{duration:700,easing:'ease-out'});
      if(!layerIs('storm'))fxLater(()=>S.thunder(),280+Math.random()*500);
      this.strike((3000+this.n*2800)*(.75+Math.random()*.5));},ms);},
    hit(){this.n++;const left=1-this.n/this.max;this.rain.set(left);
      if(left<=0){clearTimeout(this.t);document.body.classList.add('stormover');S.hush();layerTo(0,3.5);return true;}
      layerTo(Math.max(.3,left),1.5);S.lull();}
  },
  /* la carte réparée reprend ses couleurs (le défaut, lui, est animé en CSS) */

/* ------------------------------------------------------------ progression (gardée dans le navigateur, une par mer) */
const LS={stormy:'lighthouse_progress_v1',calm:'lighthouse_progress_calm_v1'};
function loadProg(s){
  try{
    const r=JSON.parse(localStorage.getItem(LS[s])||'null');
    if(r&&Array.isArray(r.done)){
      const done=r.done.filter(k=>ORDER.indexOf(k)>=0);
      let open=Math.max(1,Math.min(ORDER.length,r.open|0));
      ORDER.forEach((k,i)=>{if(done.indexOf(k)>=0&&open<i+2)open=Math.min(ORDER.length,i+2);});
      return {done:done,open:open};
    }
  }catch(e){}
  return {done:[],open:1};
}
const PROG={calm:loadProg('calm'),stormy:loadProg('stormy')};
let prog=PROG[sea];
function saveProg(){try{localStorage.setItem(LS[sea],JSON.stringify(prog));}catch(e){}}
const isOpen=k=>ORDER.indexOf(k)<prog.open;
const isDone=k=>prog.done.indexOf(k)>=0;
function firstUnfinished(){
  for(const k of ORDER)if(!isDone(k))return isOpen(k)?k:ORDER[0];
  return ORDER[0];
}
function completeBoard(k){
  const i=ORDER.indexOf(k);let pop=null;
  const grew=!isDone(k);if(grew)prog.done.push(k);
  if(i+1<ORDER.length&&prog.open<i+2){prog.open=i+2;pop=ORDER[i+1];}
  saveProg();tabs(pop);if(grew)setTimeout(()=>S.beam(),700);
}

/* ------------------------------------------------------------ le chat du phare (CAT.md) */
/* Il ne parle pas, n'écrit pas, ne juge pas : il réagit. Au repos il réfléchit avec elle ; une bonne
   réponse le fait sauter de joie ; une scène qui change l'émerveille ; une erreur le fait seulement
   pencher la tête et réfléchir encore. Jamais de déception, jamais d'insistance quand elle prend son temps. */
const CAT=document.getElementById('cat');
let catRest='hello',catT=0,catQ=[];
function catRun(){clearTimeout(catT);const n=catQ.shift();
  if(!n){CAT.dataset.pose=catRest;return;}
  CAT.dataset.pose=n[0];if(n[2])try{n[2]();}catch(e){}catT=setTimeout(catRun,n[1]);}
function catSay(seq){catQ=seq.slice();catRun();}                               /* à la place de ce qu'il faisait */
function catThen(seq){if(catQ.length||CAT.dataset.pose!==catRest)catQ=catQ.concat(seq);else catSay(seq);}  /* à la suite */
const catJump=()=>CAT.animate([{transform:'translateY(0)'},{transform:'translateY(-13%)',offset:.35},{transform:'translateY(0)',offset:.68},
  {transform:'translateY(-3%)',offset:.84},{transform:'translateY(0)'}],{duration:720,easing:'ease-out'});
const catTilt=()=>CAT.animate([{transform:'rotate(0)'},{transform:'rotate(-7deg)',offset:.3},{transform:'rotate(-7deg)',offset:.72},
  {transform:'rotate(0)'}],{duration:1400,easing:'ease-in-out'});
function catGood(wow){if(wow)catSay([['surprised',1000]]);else catSay([['cheer',1500,catJump]]);}
function catHmm(){catSay([['thinking',1400,catTilt]]);}
function nope(){S.nope();try{catHmm();}catch(e){}}
/* sur téléphone, il se pose sur le haut du plateau ; ailleurs il reste en bas à gauche */
function catPlace(){
  CAT.classList.remove('behind');
  if(innerWidth>600){CAT.style.bottom='';CAT.style.top='';return;}
  if(document.body.dataset.screen!=='board'){CAT.style.bottom='';CAT.style.top='70px';return;}
  const w=document.querySelector('.wrap').getBoundingClientRect(),h=CAT.offsetHeight,max=innerHeight-66-h,
    want=innerHeight-w.top-4+(CAT.classList.contains('named')?30:0);   /* son nom tient entre lui et le plateau */
  CAT.style.top='';CAT.style.bottom=Math.min(want,max)+'px';if(want>max)CAT.classList.add('behind');
}
addEventListener('resize',catPlace);
if(window.ResizeObserver)new ResizeObserver(()=>catPlace()).observe(document.querySelector('.wrap'));
CAT.onclick=()=>{actx();const p=Math.random()<.5?'hello':'cheer';catSay([[p,1300,p==='cheer'?catJump:null]]);S.purr();};

/* ------------------------------------------------------------ helpers */
const $=id=>document.getElementById(id);
let cur=null,idx=0,round=0,sel=null,drawId=0,doneFor=-1;
const LOCK='<svg class="lock" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M5 7V5a3 3 0 1 1 6 0v2h.5A1.5 1.5 0 0 1 13 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 13.5v-5A1.5 1.5 0 0 1 4.5 7H5zm1.5 0h3V5a1.5 1.5 0 0 0-3 0v2z"/></svg>';
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const multi=t=>t.rounds!==undefined;

function tabs(pop){
  const t=$('tabs');t.innerHTML='';
  ORDER.forEach(k=>{
    const open=isOpen(k);
    const b=el('button','tab'+(k===cur?' on':'')+(open?'':' locked')+(k===pop?' pop':''),GAME[k].title);

    t.appendChild(b);

/* ------------------------------------------------------------ le verrou d'entrée */
/* Un verrou contre une enfant curieuse, pas une sécurité : le code est public. Seule l'empreinte
   du mot de passe est écrite ici (majuscules et espaces autour ignorés). Trouvé une fois sur un
   appareil, il y reste ; changer PASS reverrouille tous les appareils. */
const PASS='20vlfw9tq7h',PKEY='lighthouse_pass_v1';
let passOK=false,wantSea=sea;
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);
  b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return (4294967296*(2097151&b)+(a>>>0)).toString(36);}
function passKnown(){if(passOK)return true;try{return localStorage.getItem(PKEY)===PASS;}catch(e){return false;}}
function tryEnter(s){
  wantSea=s||sea;
  if(passKnown()){afterPass(wantSea);return;}
  document.body.classList.add('gate');
  const p=$('pass');p.value='';try{p.focus();}catch(e){}
}
/* points au lieu des lettres : Sophia voit l'écran partagé */
if(!(window.CSS&&CSS.supports&&CSS.supports('-webkit-text-security','disc')))$('pass').type='password';
function nextBoard(){go(ORDER[ORDER.indexOf(cur)+1]);}

function done(msg,last,keep){
  if(doneFor===drawId)return;doneFor=drawId;
  if(last){if(CAT.dataset.pose==='surprised')catThen([['cheer',2000,catJump]]);else catSay([['cheer',2000]]);}
  if(last){completeBoard(cur);if(cur===FINAL)return ending();}
  S.win();if(!keep)$('say').innerHTML=msg;$('hint').textContent='';
  const n=$('next');n.textContent='Next';n.classList.add('on');
  n.onclick=()=>{actx();
    if(last){nextBoard();return;}
    if(multi(T))round++;else idx++;
    draw();};
}
function ending(){
  document.body.classList.add('dawn');
  $('say').innerHTML='';$('hint').textContent='';$('next').classList.remove('on');
  const b=$('board');b.innerHTML='';
  const e=el('div','ending','<p>Good morning, keeper.</p><p>The island is safe.</p>');
  const again=el('button',null,'Start again');
  again.onclick=()=>{actx();goCover();};
  e.appendChild(again);b.appendChild(e);
  tabs();S.chime();catRest='sleepy';catPlace();
}
/* sa page de journal de bord : les cinq heures à l'encre pâle, chaque phrase corrigée vient remplir la sienne */
function journalReset(){
  const j=$('journal');j.innerHTML='';
  HOURS.forEach(h=>{const r=el('div','jl');r.setAttribute('data-h',h);r.appendChild(el('span','t',h));r.appendChild(el('span','w',''));j.appendChild(r);});
}
function journalWrite(h,text){
  const rows=document.querySelectorAll('#journal .jl');

}
function draw(){
  drawId++;

  $('stage').scrollTop=0;
  const t=T;
  ({fix:drawFix,gap:drawGap,match:drawMatch,order:drawOrder,pick:drawPick,deduce:drawDeduce})[t.kind](t);

/* ------------------------------------------------------- corriger */
function drawFix(t){
  if(idx>=t.items.length)idx=0;
  const [toks,badI,opts,ans,hour]=t.items[idx];
  $('say').innerHTML=t.prompt;
  const b=$('board');b.innerHTML='';
  const s=el('div','sentence');s.id='sen';
  if(hour)s.appendChild(el('span','hour',hour));                  /* comme une ligne de journal de bord */
  toks.forEach((tok,i)=>{
    const e=el('span','tok click',tok);
    e.onclick=()=>{actx();
      if(i===badI){S.good();e.className='tok gap';e.textContent='?';e.id='slot';step2();}
      else{nope();e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),400);}
    };
    s.appendChild(e);
  });
  b.appendChild(s);
  function step2(){
    $('say').innerHTML='Now choose the right word.';
    document.querySelectorAll('#sen .tok.click').forEach(e=>{e.className='tok';e.onclick=null;});
    const o=el('div','opts');
    shuffle(two(opts,ans)).forEach(op=>{
      const x=el('button','opt',op);
      x.onclick=()=>{actx();
        if(op===ans){S.good();const g=$('slot');g.textContent=op;g.className='tok fixed';fxHit();
          if(hour)journalWrite(hour,toks.map((w,i)=>i===badI?ans:w).join(' '));
          x.classList.add('good');setTimeout(()=>done('Corrected.',idx>=t.items.length-1),650);}
        else{nope();x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);}
      };
      o.appendChild(x);
    });
    b.appendChild(o);
  }
}

/* ------------------------------------------------------- trou */

function drawDeduce(t){

  const b=$('board');b.innerHTML='';

    stories=stories.filter(x=>keep.indexOf(x[0])>=0);}
  const row=el('div','suspects'+(stories.length===3?' three':''));
  const why=el('div','why');why.style.display='none';
  stories.forEach(([id,text])=>{
    const c=el('button','scard');c.dataset.id=id;
    const im=el('img');im.decoding='async';im.src=A('suspect_'+id+'.jpg');im.alt='';
    c.appendChild(im);c.appendChild(el('span',null,text));
    if(ANIMAL[id])c.appendChild(el('b','nm',ANIMAL[id]));
    c.onclick=()=>{actx();
      if(id===R.ans){
        S.good();c.classList.add('good');
        row.querySelectorAll('.scard').forEach(x=>{if(x!==c)x.classList.add('dim');});row.classList.add('named');
        why.innerHTML='<p>'+R.why+'</p><p class="tell">Why? Tell me.</p>';why.style.display='block';fxHit(c,R);
        setTimeout(()=>done('',round>=t.rounds.length-1,true),700);
      }else{nope();c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),400);}
    };
    row.appendChild(c);
  });
  b.appendChild(row);
  b.appendChild(el('div','clue','<b>Clue</b>'+R.clue));
  b.appendChild(why);
}

/* ------------------------------------------------------------ events */
$('gear').onclick=e=>{e.stopPropagation();$('panel').classList.toggle('on');};
$('vol').oninput=e=>{vol=e.target.value/100;if(GAIN)GAIN.gain.value=vol;};
$('vamb').oninput=e=>{AMB.master=e.target.value/100;AMB.slots.forEach(ambApply);if(LAY.cur)layRamp(LAY.cur,layLevel(),.05);};
document.querySelectorAll('.sea').forEach(b=>{
  b.insertAdjacentHTML('afterbegin',WAVE[b.dataset.sea]);
  b.onclick=()=>{actx();tryEnter(b.dataset.sea);};
});
$('swap').onclick=()=>{actx();
  setSea(sea==='calm'?'stormy':'calm');
  if(cur)go(isOpen(cur)?cur:firstUnfinished());else tabs();
};
$('gate').onsubmit=e=>{
  e.preventDefault();actx();
  const p=$('pass'),g=$('gate');
  if(h53('lighthouse|'+p.value.trim().toLowerCase())===PASS){
    passOK=true;try{localStorage.setItem(PKEY,PASS);}catch(e){}
    p.blur();document.body.classList.remove('gate');S.good();afterPass(wantSea);
  }else{
    S.nope();p.value='';g.classList.remove('bad');void g.offsetWidth;g.classList.add('bad');
  }
};
$('skip').onclick=()=>{
  actx();$('panel').classList.remove('on');
  if(!cur){tryEnter(sea);return;}
  const t=T;
  if(!lastOf(t)){if(multi(t))round++;else idx++;draw();return;}
  completeBoard(cur);
  if(cur===FINAL)ending();else nextBoard();
};
$('again').onclick=()=>{$('panel').classList.remove('on');if(cur)go(cur);};
$('unlock').onclick=()=>{prog.open=ORDER.length;saveProg();tabs();$('panel').classList.remove('on');};
$('reset').onclick=()=>{prog=PROG[sea]={done:[],open:1};saveProg();$('panel').classList.remove('on');goCover();};
document.addEventListener('click',e=>{
  if(!$('panel').contains(e.target)&&e.target!==$('gear'))$('panel').classList.remove('on');});

/* ------------------------------------------------------------ le nom du chat */
/* Demandé une fois, juste après le mot de passe, puis gardé dans le navigateur et écrit en petit
   sous le chat. Lettres seulement, 12 au plus, la première en majuscule. Un champ vide passe aussi. */
const NKEY='lighthouse_catname_v1';
let catNameMem=null;                                      /* si le navigateur ne garde rien */
function catNameGet(){try{const v=localStorage.getItem(NKEY);if(v!==null)return v;}catch(e){}return catNameMem;}
function catNameShow(){const n=catNameGet()||'';$('catname').textContent=n;CAT.classList.toggle('named',!!n);catPlace();}
function catNameSet(v){catNameMem=v;try{localStorage.setItem(NKEY,v);}catch(e){}catNameShow();}
let NOTLETTER;try{NOTLETTER=new RegExp('[^\\p{L}]','gu');}catch(e){NOTLETTER=/[^A-Za-zÀ-ÖØ-öø-ÿ]/g;}
function cleanName(v){v=Array.from(v.replace(NOTLETTER,'')).slice(0,12).join('');return v?v.charAt(0).toUpperCase()+v.slice(1):'';}
let afterName=null;
function askName(then){afterName=then||null;const i=$('catin');i.value=catNameGet()||'';
  document.body.classList.add('naming');try{i.focus();}catch(e){}}
function afterPass(s){if(catNameGet()===null)askName(()=>enter(s));else enter(s);}
$('catin').addEventListener('input',e=>{if(e.isComposing)return;const i=e.target,c=cleanName(i.value);if(c!==i.value)i.value=c;});
$('catin').addEventListener('compositionend',e=>{const i=e.target;i.value=cleanName(i.value);});
$('nameform').onsubmit=e=>{
  e.preventDefault();actx();catNameSet(cleanName($('catin').value));$('catin').blur();
  document.body.classList.remove('naming');S.purr();const t=afterName;afterName=null;if(t)t();
};
$('rename').onclick=()=>{actx();$('panel').classList.remove('on');askName(null);};

/* ------------------------------------------------------------ robustesse (vieux navigateurs, réseau lent) */
/* « gap » dans les boîtes flexibles : inconnu avant Chrome 84 ; on le teste et on passe aux marges */
(function(){const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
  d.appendChild(document.createElement('div'));d.appendChild(document.createElement('div'));document.body.appendChild(d);
  const ok=d.scrollHeight===1;document.body.removeChild(d);if(!ok)document.documentElement.className+=' nogap';})();
$('nameimg').src=CAT.querySelector('img[data-p=hello]').src;               /* le chat est dans la page : toujours là */
/* chaque image qui arrive ou échoue est comptée ; celle qui manque laisse sa place à un mot */
const TOOLWORD={screwdriver:'screwdriver',spanner:'spanner',hammer:'hammer',cutters:'wire cutters',saw:'saw',brush:'paintbrush',tape:'tape measure',oilcan:'oil can'};
const LOSTEMO={key:'🗝️',cake:'🍰',map:'🗺️'};
document.addEventListener('load',e=>{const t=e.target;if(t&&t.tagName==='IMG')imgStat(t.src,true);},true);
document.addEventListener('error',e=>{
  const t=e.target;if(!t||t.tagName!=='IMG'||t.dataset.gone)return;t.dataset.gone='1';imgStat(t.src,false);
  const card=t.closest('.pcard'),sc=t.closest('.scard'),lost=t.closest('.lost');
  const word=w=>{const d=document.createElement('span');d.className='tname';d.textContent=w;t.replaceWith(d);};
  if(card)word(TOOLWORD[card.dataset.id]||card.dataset.id);
  else if(sc)word(ANIMAL[sc.dataset.id]||sc.dataset.id);
  else if(lost){const m=/found_(\w+)\.png/.exec(t.src),sp=document.createElement('span');sp.textContent=(m&&LOSTEMO[m[1]])||'✨';t.replaceWith(sp);}
  else t.style.visibility='hidden';
},true);
/* dans la roue dentée : les images arrivées, celles en échec, et le navigateur */
function browserName(){
  const u=navigator.userAgent,v=re=>{const m=re.exec(u);return m?m[1].split('.')[0]:'';},ch=v(/Chrome\/([\d.]+)/);
  const named=[[/MicroMessenger\/([\d.]+)/,'WeChat'],[/QQBrowser\/([\d.]+)/,'QQ Browser'],[/MetaSr ([\d.]+)/,'Sogou'],[/SogouMobileBrowser\/([\d.]+)/,'Sogou'],
    [/QihooBrowser\/([\d.]+)/,'360'],[/UCBrowser\/([\d.]+)/,'UC'],[/Edg\/([\d.]+)/,'Edge'],[/OPR\/([\d.]+)/,'Opera'],[/Firefox\/([\d.]+)/,'Firefox']];
  for(const [re,n] of named){const x=v(re);if(x)return n+' '+x+(ch?' (Chrome '+ch+')':'');}
  if(/360SE|360EE/.test(u))return '360'+(ch?' (Chrome '+ch+')':'');
  if(ch)return 'Chrome '+ch;
  const sf=v(/Version\/([\d.]+).*Safari/);return sf?'Safari '+sf:'?';
}
const BROWSER=browserName();
function diag(){const d=$('diag');if(d)d.textContent='Images: '+Object.keys(IMGSTAT.ok).length+' loaded · '+Object.keys(IMGSTAT.ko).length+' failed · '+BROWSER;}
diag();

catNameShow();setSea(sea);goCover();
</script>
