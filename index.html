         background-size:cover;background-position:center;opacity:.30;pointer-events:none;z-index:0}
  .water::after{content:"";position:absolute;inset:0;
         background:linear-gradient(to bottom, rgba(252,250,246,.55) 0%, rgba(252,250,246,.30) 45%,
                                    rgba(252,250,246,.62) 100%)}
  /* une bande claire derrière la colonne de texte, pour la lisibilité */
  .water::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:min(940px,96vw);
         transform:translateX(-50%);
         background:linear-gradient(to right, rgba(252,250,246,0) 0%, rgba(252,250,246,.72) 12%,
                                    rgba(252,250,246,.78) 88%, rgba(252,250,246,0) 100%)}

  .wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:40px 22px 40px}

  header{margin:0 0 30px}
  h1{font-family:var(--display);font-size:clamp(40px,9vw,68px);margin:0;line-height:1;
     text-shadow:0 1px 0 rgba(252,250,246,.9)}
  .sub{color:var(--ink-soft);margin:8px 0 0;font-size:19px;
       text-shadow:0 1px 0 rgba(252,250,246,.9)}

  .games{display:flex;flex-direction:column;gap:16px}

  .card{display:flex;flex-direction:column;justify-content:center;min-height:128px;
         border:2.5px solid var(--ink);border-radius:18px;background:rgba(255,255,255,.97);
         padding:12px 18px 12px 12px;
         box-shadow:0 2px 0 rgba(58,54,50,.10);transition:transform .14s ease, box-shadow .14s ease}
  .card:hover{transform:translateY(-4px);box-shadow:0 7px 0 rgba(58,54,50,.10)}
  .card .main{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit}
  .card .pic{flex:none;width:118px;height:80px;border-radius:12px;overflow:hidden;
         border:2px solid var(--ink);background:#fff;line-height:0}
  .card .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .card .txt b{display:block;font-family:var(--display);font-size:27px;line-height:1.1;margin:0 0 2px}
  .card .txt span{color:var(--ink-soft);font-size:16px;line-height:1.35;display:block}
  .card .txt i{display:block;font-style:normal;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
         color:var(--ochre);font-weight:600;margin:0 0 3px}
  /* les deux parties de Bobo's Map : deux cartes côte à côte, un même ensemble */
  .set{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card.c1{border-color:var(--ochre)}
  .card.cw{border-color:var(--terracotta)}
  .card.cl{border-color:var(--teal)}

  .fox{position:fixed;right:max(10px,calc(50% - 560px));bottom:0;width:min(210px,26vw);
       z-index:1;pointer-events:none;filter:drop-shadow(0 5px 10px rgba(58,54,50,.16))}
  .fox img{width:100%;height:auto;display:block}

  p.note{margin:30px 0 0;font-size:15px;color:var(--ink-soft);max-width:520px;text-shadow:0 1px 0 rgba(252,250,246,.9)}

  @media (max-width:900px){ .fox{display:none} }
  @media (max-width:700px){ .set{grid-template-columns:1fr} }
  @media (max-width:560px){
    .card .main{gap:12px}
    .card .pic{width:88px;height:62px}
    .card .txt b{font-size:23px}
    .card .txt span{font-size:14.5px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
